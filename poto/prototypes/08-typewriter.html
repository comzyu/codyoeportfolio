<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Poto · Typewriter mode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Special+Elite&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; }
  .cardwrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 10px 20px 4px; }
  .back { position: relative; height: 100%; max-height: 300px; aspect-ratio: 4.27 / 3; max-width: 100%; background: #F3EBDD; border-radius: var(--r-card); padding: 14px 16px; color: #1E1E1E; overflow: hidden; transform: rotate(-0.6deg); }
  .back .msg { font: 400 15px/23px "Special Elite", "Courier New", monospace; white-space: pre; margin: 0; min-height: 23px; }
  .back .msg span { display: inline-block; white-space: pre; }
  .back .caret { display: inline-block; width: 8px; height: 2px; background: var(--accent); vertical-align: baseline; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .back .left { position: absolute; right: 14px; bottom: 10px; color: #8d877b; }
  .back textarea { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; resize: none; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; }
  .machine { width: min(100%, 400px, 46vh); flex: none; padding: 0 12px; overflow: hidden; }
  .machine svg { display: block; width: 100%; height: auto; overflow: visible; margin-top: 12%; }
  .machine .key { transition: transform .09s ease-out; } .machine .key.down { transform: translateY(2.6px); transition: none; }
  .machine .key.down circle, .machine .key.down rect { fill: #d9d2c4; }
  .row { display: flex; gap: 8px; padding: 6px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
  .row button { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--ink-soft); }
  body.tweaking .row { visibility: hidden; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="cardwrap"><div class="back" id="back">
    <p class="msg" id="msg" aria-hidden="true"></p><span class="left mono" id="left">150</span>
    <textarea id="ta" maxlength="150" aria-label="Postcard message" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  </div></div>
  <div class="machine" id="machine"></div>
  <div class="row"><button type="button" id="demo">Type it for me (fast)</button><button type="button" id="clear">Clear</button></div>
</main>
<script src="shared/sounds.js"></script>
<script src="shared/typewriter.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Typewriter mode', 'v0.2 preview');
const V = Poto.panel('typewriter', [
  { key: 'strike_ms', label: 'Typebar strike', min: 20, max: 140, step: 5, value: 55, unit: 'ms' },
  { key: 'step', label: 'Carriage step', min: 1, max: 5, step: 0.1, value: 2.6, unit: 'px' },
  { key: 'return_ms', label: 'Carriage return', min: 120, max: 700, step: 10, value: 340, unit: 'ms' },
  { key: 'bell_at', label: 'Bell, chars left', min: 2, max: 10, step: 1, value: 5 },
  { key: 'wobble', label: 'Uneven baseline', min: 0, max: 2, step: 0.1, value: 0.7, unit: 'px' },
  { key: 'pressure', label: 'Ink pressure', min: 0, max: 0.5, step: 0.02, value: 0.24 },
  { key: 'voices', label: 'Max sounds at once', min: 1, max: 8, step: 1, value: 4 },
  { key: 'volume', label: 'Key volume', min: 0, max: 1, step: 0.05, value: 0.8 },
]);
const $ = (id) => document.getElementById(id), ta = $('ta'), msg = $('msg');
$('machine').innerHTML = PotoTypewriter.build();
const svg = $('machine').querySelector('svg'), carriage = svg.querySelector('#carriage'), bell = svg.querySelector('#bell');
let COLS = 26; let prev = '', col = 0, belled = false, carX = 0, carAnim = null;
// per-character imperfection is seeded by position, so the text doesn't shimmer as you keep typing
const jit = (i, k) => { const x = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
function wrap(text) {                                     // hard-wrap at COLS like a real carriage: break at the last space, or mid-word
  const lines = []; let line = '';
  for (const ch of text) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    line += ch;
    if (line.length > COLS) { const sp = line.lastIndexOf(' '); if (sp > 0) { lines.push(line.slice(0, sp)); line = line.slice(sp + 1); } else { lines.push(line.slice(0, COLS)); line = line.slice(COLS); } }
  }
  lines.push(line); return lines;
}
function render() {
  const lines = wrap(ta.value); let i = 0, html = '';
  lines.forEach((ln, li) => {
    for (const ch of ln) { const dy = jit(i, 1) * V.wobble, rot = jit(i, 2) * V.wobble * 0.9, op = 1 - V.pressure * (0.5 + 0.5 * jit(i, 3));
      html += '<span style="transform:translateY(' + dy.toFixed(2) + 'px) rotate(' + rot.toFixed(2) + 'deg);opacity:' + op.toFixed(2) + '">' + (ch === '<' ? '&lt;' : ch === '&' ? '&amp;' : ch) + '</span>'; i++; }
    if (li < lines.length - 1) html += '\n';
  });
  msg.innerHTML = html + '<span class="caret"></span>'; $('left').textContent = 150 - ta.value.length;
  return lines;
}
function setCarriage(c, ms) {                              // the carriage (and the paper on it) moves LEFT as the line fills
  const x = (0.5 - c / COLS) * 26 * V.step; if (carAnim) carAnim.cancel();
  if (ms && !Poto.reduced()) carAnim = carriage.animate([{ transform: 'translateX(' + carX + 'px)' }, { transform: 'translateX(' + x + 'px)' }], { duration: ms, easing: Poto.css('mechanical') });
  carX = x; carriage.style.transform = 'translateX(' + x + 'px)';
}
function keyDown(id) { if (!/^([A-Z]|space|return|back)$/.test(id)) return; const k = svg.querySelector('#key-' + id); if (!k) return; k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 70); }
function strike(ch) {
  const code = ch.toUpperCase().charCodeAt(0), i = code >= 65 && code <= 90 ? code - 65 : Math.abs(code) % 26, bar = svg.querySelector('#bar-' + i);
  if (Poto.reduced() || !bar) return;
  bar.setAttribute('x2', PotoTypewriter.PRINT.x); bar.setAttribute('y2', PotoTypewriter.PRINT.y); bar.setAttribute('stroke-width', 2.2);
  clearTimeout(bar._t); bar._t = setTimeout(() => { bar.setAttribute('x2', bar.dataset.rx); bar.setAttribute('y2', bar.dataset.ry); bar.setAttribute('stroke-width', 1.6); }, V.strike_ms);
}
function ring() {
  Poto.play('bell', { volume: 0.7, maxVoices: V.voices + 1 }); Poto.haptic('Soft');
  if (!Poto.reduced()) bell.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-9deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 420, easing: 'ease-out' });
}
bell.style.transformOrigin = '64px 122px'; bell.style.transformBox = 'view-box';
function carriageReturn() { keyDown('return'); Poto.play('return', { volume: V.volume, maxVoices: V.voices }); Poto.haptic('Rigid'); belled = false; }
function onInput() {
  const now = ta.value, lines = render(), last = lines[lines.length - 1], newCol = last.length;
  const prevLines = wrap(prev).length;
  if (now.length > prev.length) {
    const ch = now[now.length - 1];
    if (ch === '\n') carriageReturn();
    else if (lines.length > prevLines) { carriageReturn(); if (ch !== ' ') strike(ch); }           // the line filled up: the carriage is thrown back for you
    else if (ch === ' ') { keyDown('space'); Poto.play('space', { volume: V.volume, maxVoices: V.voices }); Poto.haptic('Light'); }
    else { keyDown(ch.toUpperCase()); strike(ch); Poto.play('key' + (1 + ((Math.random() * 3) | 0)), { volume: V.volume, detune: 60, maxVoices: V.voices }); Poto.haptic('Light'); }
    if (!belled && newCol >= COLS - V.bell_at && lines.length === prevLines) { belled = true; ring(); }
  } else if (now.length < prev.length) { keyDown('back'); Poto.play('space', { volume: V.volume * 0.6, rate: 1.4, maxVoices: V.voices }); if (newCol < COLS - V.bell_at) belled = false; }
  setCarriage(newCol, lines.length !== prevLines ? V.return_ms : 0);
  col = newCol; prev = now;
}
ta.addEventListener('input', onInput);
$('clear').onclick = () => { ta.value = ''; prev = ''; belled = false; render(); setCarriage(0, V.return_ms); };
$('demo').onclick = async () => {
  ta.value = ''; prev = ''; belled = false; render(); setCarriage(0, 0);
  const text = 'the light was like this all evening.\nyou would have hated the boat. come next time x';
  for (const ch of text) { ta.value += ch; onInput(); await Poto.wait(ch === '\n' ? 380 : 38 + Math.random() * 50); }      // ~12 characters a second: faster than most thumbs
};
// keep the machine above the phone keyboard
function fit() { const vv = window.visualViewport; if (vv) $('stage').style.height = vv.height + 'px'; }
if (window.visualViewport) { visualViewport.addEventListener('resize', fit); fit(); }
function measure() {                                      // how many characters fit across the card, like setting the margins
  const probe = document.createElement('span'); probe.textContent = 'mmmmmmmmmm'; msg.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 10; probe.remove();
  if (w > 0) COLS = Math.max(16, Math.floor((msg.clientWidth - 4) / w));
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { measure(); render(); setCarriage(0, 0); });
window.addEventListener('resize', () => { measure(); render(); });
render(); setCarriage(0, 0);
</script>
</body>
</html>
