<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poto · Camera home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  body { background: var(--viewfinder); color: var(--on-viewfinder); }
  .bar { background: rgba(11,11,11,.8); border-color: #262626; } .bar h1 { color: var(--on-viewfinder); }
  .bar a, .bar button, .bar .tag { color: #9B978F; border-color: #333; } .bar button[aria-pressed="true"] { color: var(--on-viewfinder); border-color: #777; }
  .stage { display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  .tabs { display: flex; gap: 6px; justify-content: center; padding: 8px 0 0; }
  .tabs button { height: 26px; padding: 0 12px; border: 1px solid #333; border-radius: 999px; font-size: 11.5px; color: #9B978F; }
  .tabs button[aria-pressed="true"] { background: var(--on-viewfinder); color: var(--viewfinder); border-color: var(--on-viewfinder); }
  .vf { position: relative; margin: 8px auto 0; aspect-ratio: 3 / 4; width: calc(100% - 24px); max-width: calc(52vh * .75); border-radius: 4px; overflow: hidden; background: #000; touch-action: none; }
  .vf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .28s cubic-bezier(.2,0,0,1); }
  .vf .ghost { opacity: 0; mix-blend-mode: screen; transition: opacity .3s; } .vf.de2 .ghost { opacity: .35; }
  .vf .dark { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .vf .grid { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; pointer-events: none;
    background: linear-gradient(to right, transparent calc(33.33% - .5px), rgba(247,244,238,.55) calc(33.33% - .5px), rgba(247,244,238,.55) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(247,244,238,.55) calc(66.66% - .5px), rgba(247,244,238,.55) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
                linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(247,244,238,.55) calc(33.33% - .5px), rgba(247,244,238,.55) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(247,244,238,.55) calc(66.66% - .5px), rgba(247,244,238,.55) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  .vf.g .grid { opacity: 1; }
  .vf .mark { position: absolute; left: 10px; top: 10px; color: var(--on-viewfinder); text-shadow: 0 0 4px #000; opacity: 0; } .vf.de1 .mark, .vf.de2 .mark { opacity: 1; }
  .vf .count { position: absolute; inset: 0; display: grid; place-items: center; font: 500 96px/1 "IBM Plex Mono", monospace; color: var(--on-viewfinder); text-shadow: 0 2px 20px rgba(0,0,0,.5); opacity: 0; pointer-events: none; }
  .zoom { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(11,11,11,.45); }
  .zoom button { min-width: 34px; height: 26px; border-radius: 999px; font: 500 10.5px/1 "IBM Plex Mono", monospace; color: #cfcbc3; }
  .zoom button[aria-pressed="true"] { background: var(--on-viewfinder); color: var(--viewfinder); }
  .ev { position: absolute; left: 0; top: 0; bottom: 0; width: 44px; display: none; align-items: center; justify-content: center; }
  .ev i { width: 1px; height: 46%; background: rgba(247,244,238,.5); position: relative; opacity: var(--dim, .3); transition: opacity .3s; }
  .ev i::after { content: ""; position: absolute; left: -5px; width: 11px; height: 11px; border-radius: 50%; background: var(--on-viewfinder); top: calc(50% - var(--evp, 0) * 50% - 5.5px); }
  .ev span { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity .3s; text-shadow: 0 0 4px #000; }
  .B .ev { display: flex; } .B .awake .ev i, .B .awake .ev span { opacity: 1; }
  .edge { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 4px; align-items: flex-end; }
  .B .edge { display: flex; }
  .edge .chip { background: rgba(11,11,11,.45); opacity: var(--dim, .3); transition: opacity .3s; } .B .awake .edge .chip { opacity: 1; }
  .meta { display: flex; justify-content: space-between; padding: 12px 22px 0; }
  .meta .mono { font-size: 12px; } .odo { font-variant-numeric: tabular-nums; }
  .chip { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #333; font: 500 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: .06em; color: #8d8982; white-space: nowrap; }
  .chip.on { color: var(--on-viewfinder); border-color: #777; }
  .tray { overflow: hidden; height: 0; transition: height var(--tray-ms, 260ms) cubic-bezier(.2,0,0,1); }
  .A.open .tray { height: 118px; }
  .tray .in { padding: 10px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .tray .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .tray .chip { height: 28px; padding: 0 4px; }
  .tray .evrow { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 8px; color: #8d8982; }
  .tray input[type=range] { width: 100%; accent-color: #F7F4EE; min-width: 0; }
  .deck { flex: 1; min-height: 84px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 26px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--on-viewfinder); padding: 5px; }
  .shutter i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--on-viewfinder); transition: transform .08s; } .shutter:active i { transform: scale(.86); }
  .diary { width: 40px; height: 52px; border-radius: 2px; background: var(--photo-paper); padding: 2px 2px 7px; transform: rotate(-4deg); justify-self: start; display: block; }
  .diary img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .more { justify-self: end; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333; color: #cfcbc3; font-size: 18px; letter-spacing: 1px; }
  .B .more { visibility: hidden; }
  .A.open .more { background: var(--on-viewfinder); color: var(--viewfinder); }
  @media (prefers-reduced-motion: reduce) { .tray, .vf img { transition: none; } }
</style>
</head>
<body>
<main class="stage A" id="stage">
  <div class="tabs" role="group" aria-label="Layout option">
    <button type="button" data-l="A" aria-pressed="true">A · Drawer</button><button type="button" data-l="B" aria-pressed="false">B · Edge</button>
  </div>
  <div class="vf" id="vf">
    <img id="scene" src="shared/img/window-raw.jpg" alt="Plain viewfinder"><img class="ghost" id="ghost" src="shared/img/dusk-raw.jpg" alt="">
    <div class="grid"></div><div class="mark mono" id="mark">1 of 2</div><div class="count" id="count"></div><div class="dark"></div>
    <div class="ev" id="ev" aria-hidden="true"><i></i><span class="mono" id="evlab">0.0</span></div>
    <div class="edge" id="edge"></div>
    <div class="zoom" role="group" aria-label="Zoom"><button type="button" data-z=".5" aria-pressed="false">.5</button><button type="button" data-z="1" aria-pressed="true">1×</button><button type="button" data-z="2" aria-pressed="false">2</button></div>
  </div>
  <div class="meta"><span class="mono">Sunday</span><span class="mono odo" id="odo">14/27</span></div>
  <div class="tray" id="tray"><div class="in">
    <div class="evrow mono"><span>−2</span><input id="evr" type="range" min="-2" max="2" step="0.1" value="0" aria-label="Exposure"><span id="evv" style="text-align:right">0.0</span></div>
    <div class="chips" id="chips"></div>
  </div></div>
  <div class="deck">
    <a class="diary" href="06-diary.html" aria-label="Open the diary"><img src="shared/img/table-sunday.jpg" alt=""></a>
    <button class="shutter" id="shutter" type="button" aria-label="Shutter"><i></i></button>
    <button class="more" id="more" type="button" aria-label="Camera controls" aria-expanded="false">···</button>
  </div>
</main>
<script src="shared/sounds.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Camera home', 'v0.1');
const V = Poto.panel('camera', [
  { key: 'tray_ms', label: 'Drawer speed (A)', min: 120, max: 600, step: 10, value: 260, unit: 'ms' },
  { key: 'idle_s', label: 'Auto-close after', min: 2, max: 10, step: 0.5, value: 4, unit: 's' },
  { key: 'dim', label: 'Resting dim (B)', min: 0, max: 0.8, step: 0.05, value: 0.3 },
], apply);
const $ = (id) => document.getElementById(id), stage = $('stage'), vf = $('vf'), scene = $('scene');
const S = { flash: 'off', timer: 'off', grid: false, date: false, double: false, front: false, zoom: 1, ev: 0, count: 14, de: 0 };
const CONTROLS = [
  { k: 'flash', label: () => 'Flash ' + S.flash, on: () => S.flash !== 'off', tap() { S.flash = { off: 'auto', auto: 'on', on: 'off' }[S.flash]; } },
  { k: 'timer', label: () => 'Timer ' + S.timer, on: () => S.timer !== 'off', tap() { S.timer = { off: '3s', '3s': '10s', '10s': 'off' }[S.timer]; } },
  { k: 'grid', label: () => 'Grid', on: () => S.grid, tap() { S.grid = !S.grid; } },
  { k: 'date', label: () => 'Date', on: () => S.date, tap() { S.date = !S.date; } },
  { k: 'double', label: () => 'Double', on: () => S.double, tap() { S.double = !S.double; S.de = 0; } },
  { k: 'flip', label: () => 'Flip', on: () => S.front, tap() { S.front = !S.front; blink(); setTimeout(() => (scene.src = 'shared/img/' + (S.front ? 'table' : 'window') + '-raw.jpg'), 70); } },
];
let idle = 0;
function apply() { stage.style.setProperty('--tray-ms', V.tray_ms + 'ms'); stage.style.setProperty('--dim', V.dim); }
function paint() {
  for (const host of [$('chips'), $('edge')]) {
    host.innerHTML = '';
    CONTROLS.forEach((c) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (c.on() ? ' on' : ''); b.textContent = c.label().toUpperCase(); b.setAttribute('aria-pressed', String(c.on()));
      b.onclick = (e) => { e.stopPropagation(); if (stage.classList.contains('B') && !vf.classList.contains('awake')) { wake(); return; } c.tap(); Poto.haptic('Selection'); paint(); wake(); }; host.appendChild(b); });
  }
  vf.classList.toggle('g', S.grid); vf.classList.toggle('de1', S.double && S.de === 0); vf.classList.toggle('de2', S.double && S.de === 1);
  $('mark').textContent = S.de === 0 ? '1 of 2' : '2 of 2';
  scene.style.transform = 'scale(' + (S.zoom === 0.5 ? 1 : S.zoom === 1 ? 1.45 : 2.9) + ')'; scene.style.filter = 'brightness(' + Math.pow(2, S.ev * 0.6) + ')';
  document.querySelectorAll('.zoom button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.z === S.zoom)));
  $('evv').textContent = $('evlab').textContent = (S.ev > 0 ? '+' : '') + S.ev.toFixed(1); $('evr').value = S.ev; $('ev').style.setProperty('--evp', S.ev / 2);
  $('odo').textContent = String(S.count).padStart(2, '0') + '/27';
}
function wake() {            // any touch on the controls keeps them up; they tuck away on their own
  clearTimeout(idle); vf.classList.add('awake');
  idle = setTimeout(() => { vf.classList.remove('awake'); setOpen(false); }, V.idle_s * 1000);
}
function setOpen(o) { stage.classList.toggle('open', o); $('more').setAttribute('aria-expanded', String(o)); if (o) wake(); }
function blink() { if (!Poto.reduced()) vf.querySelector('.dark').animate([{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: 150 }); }
$('more').onclick = () => { setOpen(!stage.classList.contains('open')); Poto.haptic('Light'); };
$('evr').oninput = (e) => { S.ev = +e.target.value; paint(); wake(); };
document.querySelectorAll('.zoom button').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); S.zoom = +b.dataset.z; Poto.haptic('Selection'); paint(); }));
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => {
  stage.classList.remove('A', 'B', 'open'); stage.classList.add(b.dataset.l); vf.classList.remove('awake');
  document.querySelectorAll('.tabs button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
}));
// B: tap the viewfinder to wake the edge controls; drag up/down on the left edge for exposure
let drag = null;
vf.addEventListener('pointerdown', (e) => {
  if (!stage.classList.contains('B')) { setOpen(false); return; }
  const r = vf.getBoundingClientRect(); wake();
  if (e.clientX - r.left < 56) { drag = { y: e.clientY, ev: S.ev, h: r.height }; vf.setPointerCapture(e.pointerId); }
});
vf.addEventListener('pointermove', (e) => { if (!drag) return; const ev = Poto.clamp(drag.ev + ((drag.y - e.clientY) / (drag.h * 0.46)) * 4, -2, 2); const r = Math.round(ev * 10) / 10; if (r !== S.ev) { S.ev = r; if (Number.isInteger(r * 2)) Poto.haptic('Selection'); paint(); } wake(); });
vf.addEventListener('pointerup', () => (drag = null)); vf.addEventListener('pointercancel', () => (drag = null));
async function shoot() {
  setOpen(false); vf.classList.remove('awake');
  if (S.timer !== 'off') {
    const c = $('count');
    for (let n = parseInt(S.timer); n > 0; n--) { c.textContent = n; c.style.opacity = 1; Poto.haptic('Selection'); await Poto.wait(parseInt(S.timer) > 3 ? 350 : 1000); }   // 10 s is sped up in this mockup
    c.style.opacity = 0;
  }
  Poto.haptic('Medium'); Poto.play('shutter', { detune: 25 }); blink();
  const tick = () => setTimeout(() => { S.count = S.count >= 27 ? 1 : S.count + 1; paint(); }, 260);
  // double exposure: the exposure is spent (counter ticks) on the first press; the film only advances after the second
  if (S.double && S.de === 0) { S.de = 1; $('ghost').src = scene.src; scene.src = 'shared/img/dusk-raw.jpg'; paint(); tick(); return; }   // (the scene changes here to stand in for you moving the camera)
  const second = S.double; if (second) { S.de = 0; S.double = false; scene.src = 'shared/img/window-raw.jpg'; paint(); }
  setTimeout(() => Poto.play('advance', { detune: 20, volume: 0.9 }), 180);
  if (!second) tick();
  setTimeout(() => Poto.haptic('Soft'), 700);
}
$('shutter').onclick = shoot;
apply(); paint();
</script>
</body>
</html>
