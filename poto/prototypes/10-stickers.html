<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Poto · Sticker peel and place</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=La+Belle+Aurore&family=Special+Elite&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  .top { height: 56px; display: flex; align-items: center; justify-content: center; }
  .bin { height: 36px; padding: 0 16px; border-radius: 999px; border: 1px dashed var(--ink-soft); color: var(--ink-soft); display: flex; align-items: center; opacity: 0; transform: translateY(-8px) scale(.96); transition: opacity .2s, transform .2s cubic-bezier(.2,0,0,1), background .15s, color .15s; }
  .bin.show { opacity: 1; transform: none; } .bin.hot { background: var(--accent); color: var(--paper); border-color: var(--accent); transform: scale(1.08); }
  .cardwrap { flex: 1; min-height: 0; display: flex; align-items: center; }
  .back { position: relative; height: min(100%, 420px); aspect-ratio: 3 / 4.27; background: #F3EBDD; border-radius: var(--r-card); padding: 8% 7%; color: #1E1E1E; box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 10px 28px -10px rgba(0,0,0,.28); }
  .back .stamp { position: absolute; right: 6%; top: 5%; width: 24%; transform: rotate(2deg); pointer-events: none; } .back .stamp svg, .back .pm svg { width: 100%; height: auto; display: block; }
  .back .pm { position: absolute; right: 13%; top: 9%; width: 46%; transform: rotate(-9deg); pointer-events: none; }
  .back p { font: 400 14px/22px "Special Elite", "Courier New", monospace; margin: 48% 0 0; max-width: 92%; pointer-events: none; }
  .st { position: fixed; left: 0; top: 0; z-index: 20; touch-action: none; cursor: grab; will-change: transform; }
  .st svg { display: block; width: 100%; height: auto; pointer-events: none; transition: filter .16s; filter: drop-shadow(0 .6px .5px rgba(0,0,0,.22)); }
  .st.up svg { filter: drop-shadow(0 calc(var(--lift, 10) * 1px) calc(var(--lift, 10) * .9px) rgba(0,0,0,.3)); }
  .tray { width: 100%; flex: none; border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
  .tray .rail { display: flex; gap: 14px; align-items: center; overflow-x: auto; padding: 4px 20px; scrollbar-width: none; touch-action: pan-x; } .tray .rail::-webkit-scrollbar { display: none; }
  .tray button { flex: none; height: 54px; display: grid; place-items: center; touch-action: pan-x; } .tray button svg { height: 46px; width: auto; display: block; pointer-events: none; }
  .tray .count { text-align: center; padding-top: 6px; color: var(--ink-soft); }
  .tray.full .rail { opacity: .35; }
  body.tweaking .tray { visibility: hidden; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="top"><div class="bin mono" id="bin">Drop here to remove</div></div>
  <div class="cardwrap"><div class="back" id="card"><div class="stamp" id="stamp"></div><div class="pm" id="pm"></div><p>we found the good noodle place again. it was shut.</p></div></div>
  <div class="tray" id="tray"><div class="rail" id="rail"></div><div class="count mono" id="count">Drag a sticker up · 0 of 5</div></div>
</main>
<script src="shared/sounds.js"></script>
<script src="shared/art.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Sticker peel + place', 'v0.2 preview');
const V = Poto.panel('stickers', [
  { key: 'peel_scale', label: 'Lift size', min: 1, max: 1.4, step: 0.01, value: 1.14 },
  { key: 'lift', label: 'Lift shadow', min: 0, max: 24, step: 1, value: 11, unit: 'px' },
  { key: 'peel_tilt', label: 'Peel tilt', min: 0, max: 16, step: 0.5, value: 6, unit: '°' },
  { key: 'crooked', label: 'Crookedness', min: 0, max: 14, step: 0.5, value: 5, unit: '°' },
  { key: 'pat_ms', label: 'Pat down', min: 60, max: 400, step: 10, value: 170, unit: 'ms' },
  { key: 'pat_squash', label: 'Pat squash', min: 0.85, max: 1, step: 0.01, value: 0.95 },
]);
const $ = (id) => document.getElementById(id), card = $('card'), bin = $('bin'), rail = $('rail'), MAX = 5;
$('stamp').innerHTML = POTO_ART.stamp; $('pm').innerHTML = POTO_ART.postmark;
const placed = new Set(); let z = 20;
const WIDE = { squiggle: 2.1, tape: 2.1, ticket: 1.7, wish: 2.3, airmail: 2.4 };
Object.keys(POTO_ART.stickers).forEach((name) => {
  const b = document.createElement('button'); b.type = 'button'; b.innerHTML = POTO_ART.stickers[name]; b.setAttribute('aria-label', 'Add ' + name + ' sticker');
  // a deliberate upward drag (or a tap) peels; sideways drags scroll the tray
  let start = null;
  b.addEventListener('pointerdown', (e) => { start = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  b.addEventListener('pointermove', (e) => { if (!start) return; const dy = start.y - e.clientY, dx = Math.abs(e.clientX - start.x); if (dy > 10 && dy > dx) { const s0 = start; start = null; peel(name, b, e, s0.id); } });
  b.addEventListener('pointerup', () => { start = null; }); b.addEventListener('pointercancel', () => { start = null; });
  b.addEventListener('click', (e) => { if (e.detail === 0) peel(name, b, null); });              // keyboard: Enter places it mid-card
  rail.appendChild(b);
});
function paintCount() { $('count').textContent = placed.size >= MAX ? "5 of 5 · that's the lot" : 'Drag a sticker up · ' + placed.size + ' of 5'; $('tray').classList.toggle('full', placed.size >= MAX); }
function setT(s) { s.el.style.transform = 'translate(' + s.x + 'px,' + s.y + 'px) translate(-50%,-50%) rotate(' + s.r + 'deg) scale(' + s.s * s.k + ')'; }
function peel(name, btn, e, pid) {
  if (placed.size >= MAX) { Poto.haptic('Rigid'); return; }
  const r = btn.getBoundingClientRect(), w = 62 * (WIDE[name] || 1);
  const el = document.createElement('div'); el.className = 'st'; el.style.width = w + 'px'; el.innerHTML = POTO_ART.stickers[name]; document.body.appendChild(el);
  const s = { el, name, x: r.left + r.width / 2, y: r.top + r.height / 2, r: 0, s: 1, k: 1, ptr: new Map() };
  setT(s); wire(s); Poto.haptic('Light');
  if (e) { try { el.setPointerCapture(pid); } catch (err) {} grab(s, e, true); }
  else { const c = card.getBoundingClientRect(); s.x = c.left + c.width * (0.3 + Math.random() * 0.4); s.y = c.top + c.height * (0.55 + Math.random() * 0.3); drop(s, true); }
}
function lift(s, on) {
  s.el.classList.toggle('up', on); s.el.style.setProperty('--lift', V.lift); s.el.style.zIndex = ++z;
  const from = s.k, to = on ? V.peel_scale : 1;
  if (Poto.reduced()) { s.k = to; setT(s); return; }
  if (s.kAnim) s.kAnim.cancel(); s.kAnim = Poto.run(140, (t) => { s.k = from + (to - from) * t; setT(s); }, 'out');
}
function grab(s, e, fresh) {
  s.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (s.ptr.size === 1) { s.fresh = fresh; s.wasPlaced = placed.has(s); lift(s, true); if (fresh) s.r = -V.peel_tilt; bin.classList.toggle('show', !fresh); setT(s); }
  s.base = snapshot(s);
}
function snapshot(s) { const p = [...s.ptr.values()]; const o = { x: s.x, y: s.y, r: s.r, s: s.s, cx: 0, cy: 0, d: 0, a: 0 };
  p.forEach((q) => { o.cx += q.x / p.length; o.cy += q.y / p.length; });
  if (p.length > 1) { o.d = Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y); o.a = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x); } return o; }
function wire(s) {
  const el = s.el;
  el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); grab(s, e, false); });
  el.addEventListener('pointermove', (e) => {
    if (!s.ptr.has(e.pointerId)) return; s.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = snapshot(s), b = s.base; s.x = b.x + now.cx - b.cx; s.y = b.y + now.cy - b.cy;
    if (s.ptr.size > 1 && b.d > 0) { s.s = Poto.clamp(b.s * (now.d / b.d), 0.5, 2.6); s.r = b.r + ((now.a - b.a) * 180) / Math.PI; }     // two fingers: pinch to size, twist to turn
    setT(s);
    if (!s.fresh) { const br = bin.getBoundingClientRect(); const hot = s.y < br.bottom + 14; if (hot !== bin.classList.contains('hot')) { bin.classList.toggle('hot', hot); if (hot) Poto.haptic('Selection'); } }
  });
  const end = (e) => { if (!s.ptr.has(e.pointerId)) return; s.ptr.delete(e.pointerId); if (s.ptr.size) { s.base = snapshot(s); return; } drop(s, false); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', (e) => { e.preventDefault(); if (e.shiftKey) s.r += e.deltaY * 0.1; else s.s = Poto.clamp(s.s * (1 - e.deltaY * 0.0015), 0.5, 2.6); setT(s); }, { passive: false });   // desktop: wheel = size, shift+wheel = turn
}
function drop(s, auto) {
  const c = card.getBoundingClientRect(), onCard = s.x > c.left - 10 && s.x < c.right + 10 && s.y > c.top - 10 && s.y < c.bottom + 10, binned = bin.classList.contains('hot');
  bin.classList.remove('show', 'hot');
  if (binned || !onCard) {                                  // removed: into the bin, or let go off the card
    if (binned) { Poto.haptic('Rigid'); Poto.play('whoosh', { rate: 1.8, volume: 0.35 }); }
    placed.delete(s); paintCount();
    s.el.animate([{ opacity: 1 }, { opacity: 0, transform: s.el.style.transform + ' scale(.6)' }], { duration: Poto.reduced() ? 0 : 160, fill: 'forwards' }).onfinish = () => s.el.remove(); return;
  }
  if (!placed.has(s)) { placed.add(s); if (!auto) s.r += (Math.random() * 2 - 1) * V.crooked; else s.r = (Math.random() * 2 - 1) * V.crooked; }   // it never lands perfectly straight
  else if (s.fresh === false && s.ptr.size === 0) s.r += (Math.random() * 2 - 1) * V.crooked * 0.25;
  paintCount(); s.el.classList.remove('up');
  // the pat: presses flat (slightly squashed), then relaxes. Sound + haptic land on the squash.
  const k0 = s.k, ms = Poto.reduced() ? 0 : V.pat_ms; if (s.kAnim) s.kAnim.cancel();
  Poto.play('pat', { detune: 80, volume: 0.9 }); Poto.haptic('Light');
  s.kAnim = Poto.run(ms, (t) => { s.k = t < 0.45 ? Poto.lerp(k0, V.pat_squash, Poto.ease('in')(t / 0.45)) : Poto.lerp(V.pat_squash, 1, Poto.ease('out')((t - 0.45) / 0.55)); setT(s); });
  s.kAnim.done.then(() => { s.k = 1; setT(s); });
}
paintCount();
</script>
</body>
</html>
