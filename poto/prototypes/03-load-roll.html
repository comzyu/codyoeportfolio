<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poto · Load a roll</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  .stage { display: flex; flex-direction: column; }
  h2 { font-size: var(--t-title); line-height: 28px; font-weight: 500; letter-spacing: -0.01em; margin: 22px 0 2px; }
  .rail { flex: 1; min-height: 0; display: flex; align-items: center; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 calc(50% - min(33vw, 130px)); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .rail::-webkit-scrollbar { display: none; }
  .look { flex: 0 0 min(66vw, 260px); scroll-snap-align: center; text-align: left; transition: transform .3s cubic-bezier(.2,0,0,1), opacity .3s; opacity: .55; transform: scale(.92); }
  .look.on { opacity: 1; transform: scale(1) rotate(var(--tilt, 0deg)); }
  .look .print { padding: 3.6% 3.6% 0; }
  .look img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .look .cap { display: block; padding: 7px 1% 8px; color: #6B6B6B; }
  .look b { display: block; margin-top: 14px; font-weight: 500; font-size: 17px; }
  .look small { display: block; font-size: 13px; line-height: 18px; color: var(--ink-soft); min-height: 36px; }
  .foot { padding-top: 6px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  .cta { width: 100%; height: 50px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 500; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; margin: 0 auto; max-width: 430px; background: var(--paper); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 26px 24px calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .34s cubic-bezier(.2,0,0,1); }
  .confirm .scrim { opacity: 1; pointer-events: auto; } .confirm .sheet { transform: none; }
  .sheet p { font-size: 19px; line-height: 26px; margin: 0 0 4px; font-weight: 500; } .sheet p + p { font-size: 14px; line-height: 20px; font-weight: 400; color: var(--ink-soft); margin-bottom: 22px; }
  .sheet .two { display: flex; gap: 10px; } .sheet .two button { flex: 1; height: 48px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; }
  .sheet .two .go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .loader { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  .loading .loader { display: flex; }
  .loader svg { width: min(78vw, 320px); height: auto; overflow: visible; }
  .loader .status { height: 20px; color: var(--ink-soft); }
  .loader a { height: 46px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; display: inline-flex; align-items: center; font-weight: 500; opacity: 0; }
  .loader button { color: var(--ink-soft); font-size: 13px; opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .look, .sheet, .scrim { transition: none; } }
</style>
</head>
<body>
<main class="stage">
  <div class="pad"><h2>Load a roll.</h2><p class="note" style="margin:0">Pick one. It stays for all 27.</p></div>
  <div class="rail" id="rail"></div>
  <div class="foot pad"><button class="cta" id="cta" type="button">Load SUNDAY</button></div>
</main>
<div class="scrim" id="scrim"></div>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lockline">
  <p id="lockline">This roll is locked to SUNDAY. 27&nbsp;shots.</p><p>No switching halfway. That's the fun part.</p>
  <div class="two"><button type="button" id="no">Not yet</button><button type="button" class="go" id="yes">Load it</button></div>
</div>
<div class="loader" id="loader" aria-live="polite">
  <svg viewBox="0 0 320 200" role="img" aria-label="A film canister being loaded">
    <g id="well"><rect x="14" y="40" width="292" height="120" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
      <circle cx="262" cy="100" r="26" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="262" cy="100" r="5" fill="var(--line)"/></g>
    <g id="film"><rect id="strip" x="96" y="72" width="0" height="56" fill="#2A2522"/>
      <g id="holes" fill="var(--paper)"></g></g>
    <g id="can"><rect x="36" y="52" width="62" height="96" rx="7" fill="#2A2522"/><rect x="42" y="44" width="50" height="10" rx="3" fill="#2A2522"/><rect x="42" y="146" width="50" height="10" rx="3" fill="#2A2522"/>
      <rect id="label" x="36" y="70" width="62" height="60" fill="#E2A93B"/><text id="canname" x="67" y="104" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1" fill="#1B1B1B" transform="rotate(-90 67 100)">SUNDAY</text>
      <rect x="94" y="72" width="6" height="56" fill="#1B1B1B"/></g>
    <rect id="door" x="14" y="40" width="292" height="120" rx="10" fill="var(--ink)" opacity="0"/>
    <text id="doortext" x="160" y="105" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.5" fill="var(--paper)" opacity="0">SUNDAY · 0/27</text>
  </svg>
  <div class="status mono" id="status"></div>
  <a href="05-camera.html" id="open">Open the camera</a>
  <button type="button" id="replay">Play it again</button>
</div>
<script src="shared/sounds.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Load a roll', 'v0.1');
const V = Poto.panel('load-roll', [
  { key: 'tilt', label: 'Card tilt', min: 0, max: 4, step: 0.25, value: 1.25, unit: '°' },
  { key: 'drop_ms', label: 'Canister drop', min: 150, max: 800, step: 10, value: 380, unit: 'ms' },
  { key: 'wind_ms', label: 'Leader wind', min: 300, max: 1400, step: 20, value: 720, unit: 'ms' },
  { key: 'door_ms', label: 'Door close', min: 120, max: 700, step: 10, value: 300, unit: 'ms' },
  { key: 'pause_ms', label: 'Beat between', min: 0, max: 400, step: 10, value: 120, unit: 'ms' },
], () => paintTilt());
const LOOKS = [
  { slug: 'sunday', name: 'Sunday', desc: 'Warm and soft. For any old day.', img: 'window', color: '#E2A93B' },
  { slug: 'harbour', name: 'Harbour', desc: 'Cool shadows, quiet reds. For going places.', img: 'dusk', color: '#3E7C80' },
  { slug: 'flashbulb', name: 'Flashbulb', desc: 'Loud, bright, a little too much flash.', img: 'table', color: '#D8553F' },
];
const rail = document.getElementById('rail'), cta = document.getElementById('cta'), $ = (id) => document.getElementById(id);
let cur = 0;
LOOKS.forEach((l, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'look' + (i === 0 ? ' on' : ''); b.setAttribute('aria-label', l.name + '. ' + l.desc);
  b.innerHTML = '<span class="print" style="display:block"><img src="shared/img/' + l.img + '-' + l.slug + '.jpg" alt=""><span class="cap mono">' + l.name + ' · 27 shots</span></span><b>' + l.name + '</b><small>' + l.desc + '</small>';
  b.onclick = () => b.scrollIntoView({ behavior: Poto.reduced() ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  rail.appendChild(b);
});
const cards = [...rail.children];
function paintTilt() { cards.forEach((c, i) => c.style.setProperty('--tilt', (i % 2 ? 1 : -1) * V.tilt + 'deg')); }
paintTilt();
rail.addEventListener('scroll', () => {
  const mid = rail.scrollLeft + rail.clientWidth / 2; let best = 0, bd = 1e9;
  cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
  if (best !== cur) { cur = best; cards.forEach((c, i) => c.classList.toggle('on', i === cur)); cta.textContent = 'Load ' + LOOKS[cur].name.toUpperCase(); Poto.haptic('Selection'); }
}, { passive: true });
cta.onclick = () => { $('lockline').textContent = 'This roll is locked to ' + LOOKS[cur].name.toUpperCase() + '. 27\u00a0shots.'; document.body.classList.add('confirm'); $('yes').focus(); };
$('no').onclick = $('scrim').onclick = () => document.body.classList.remove('confirm');
$('yes').onclick = () => { document.body.classList.remove('confirm'); load(); };
$('replay').onclick = load;

const holes = $('holes');
for (let i = 0; i < 16; i++) for (const y of [76, 119]) { const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); r.setAttribute('x', 102 + i * 11); r.setAttribute('y', y); r.setAttribute('width', 5); r.setAttribute('height', 5); r.setAttribute('rx', 1); r.setAttribute('opacity', 0); holes.appendChild(r); }
async function load() {
  const L = LOOKS[cur], name = L.name.toUpperCase(), rm = Poto.reduced(), can = $('can'), strip = $('strip'), door = $('door'), dt = $('doortext');
  $('label').setAttribute('fill', L.color); $('canname').textContent = name; dt.textContent = name + ' · 0/27';
  document.body.classList.add('loading'); $('status').textContent = '';
  [door, dt, $('open'), $('replay')].forEach((e) => (e.style.opacity = 0)); strip.setAttribute('width', 0); [...holes.children].forEach((h) => h.setAttribute('opacity', 0));
  if (rm) {                                       // reduce motion: no mechanics, just the result
    door.style.opacity = 1; dt.style.opacity = 1; Poto.haptic('Medium'); Poto.play('shutter', { rate: 0.7, volume: 0.8 });
  } else {
    // 1. the canister drops into the well and seats with a clack
    await can.animate([{ transform: 'translateY(-150px) rotate(-7deg)', opacity: 0 }, { opacity: 1, offset: 0.3 }, { transform: 'translateY(0) rotate(0)', opacity: 1 }], { duration: V.drop_ms, easing: Poto.css('in'), fill: 'both' }).finished;
    Poto.play('pat', { rate: 1.5 }); Poto.play('key2', { volume: 0.5, rate: 0.7 }); Poto.haptic('Rigid');
    can.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(3px)' }, { transform: 'translateY(0)' }], { duration: 140, easing: 'ease-out' });
    await Poto.wait(V.pause_ms + 140);
    // 2. the leader is drawn across to the take-up spool
    $('status').textContent = 'Winding on…'; Poto.play('advance', { rate: 620 / V.wind_ms });
    await Poto.run(V.wind_ms, (t) => { const w = 160 * t; strip.setAttribute('width', w); [...holes.children].forEach((h) => h.setAttribute('opacity', +h.getAttribute('x') < 96 + w - 6 ? 1 : 0)); }, 'mechanical').done;
    Poto.haptic('Soft'); await Poto.wait(V.pause_ms);
    // 3. the back closes
    door.style.opacity = 1;
    await door.animate([{ transform: 'translateX(300px)' }, { transform: 'translateX(0)' }], { duration: V.door_ms, easing: Poto.css('in') }).finished;
    Poto.play('shutter', { rate: 0.62, volume: 0.9 }); Poto.haptic('Medium');
    door.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-2px)' }, { transform: 'translateX(0)' }], { duration: 120 });
    await Poto.wait(160);
    dt.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, fill: 'forwards' });
  }
  $('status').textContent = 'Loaded. Shoot anything.';
  await Poto.wait(rm ? 0 : 350);
  [$('open'), $('replay')].forEach((e) => e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: rm ? 0 : 300, fill: 'forwards' }));
}
</script>
</body>
</html>
