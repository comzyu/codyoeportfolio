<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poto · Roll complete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }
  .cam { position: absolute; inset: calc(44px + env(safe-area-inset-top, 0px)) 0 0 0; background: var(--viewfinder); color: var(--on-viewfinder); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 2; }
  .cam .big { font: 500 44px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .04em; display: inline-flex; font-variant-numeric: tabular-nums; }
  .cam .d { position: relative; display: inline-block; width: 1ch; height: 1.2em; overflow: hidden; }
  .cam .d span { position: absolute; left: 0; top: 0; line-height: 1.2em; }
  .cam .mono { color: #9B978F; }
  .cam button { margin-top: 26px; height: 46px; padding: 0 24px; border-radius: 999px; border: 1px solid #555; color: var(--on-viewfinder); }
  svg { width: min(56vw, 220px); height: auto; overflow: visible; }
  h2 { font-size: var(--t-title); line-height: 28px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  .sub { margin: -14px 0 0; color: var(--ink-soft); font-size: 14px; }
  .cta { height: 50px; padding: 0 30px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; }
  .quiet { color: var(--ink-soft); font-size: 13px; margin-top: -8px; }
  .fade { opacity: 0; }
</style>
</head>
<body>
<main class="stage pad">
  <svg viewBox="0 0 220 170" role="img" aria-label="A finished film canister">
    <rect x="40" y="118" width="140" height="44" rx="8" fill="none" stroke="var(--line)" stroke-width="2"/>
    <rect x="40" y="118" width="140" height="6" fill="var(--paper)"/>
    <g id="can"><rect x="79" y="30" width="62" height="96" rx="7" fill="#2A2522"/><rect x="85" y="22" width="50" height="10" rx="3" fill="#2A2522"/><rect x="85" y="124" width="50" height="10" rx="3" fill="#2A2522"/>
      <rect x="79" y="48" width="62" height="60" fill="#E2A93B"/><text x="110" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1" fill="#1B1B1B" transform="rotate(-90 110 78)">SUNDAY</text></g>
    <rect x="30" y="134" width="160" height="40" fill="var(--paper)"/>
    <path d="M40 134 v20 a8 8 0 0 0 8 8 h124 a8 8 0 0 0 8 -8 v-20" fill="none" stroke="var(--line)" stroke-width="2"/>
  </svg>
  <h2 class="fade" id="t1">Roll complete.</h2>
  <p class="sub fade" id="t2">27 shots on SUNDAY. They're in your diary.</p>
  <a class="cta fade" id="t3" href="03-load-roll.html">Load a new roll</a>
  <button type="button" class="quiet fade" id="t4">Play it again</button>
  <div class="cam" id="cam">
    <span class="mono">Sunday</span>
    <span class="big" aria-label="27 of 27"><span id="odo" style="display:inline-flex"></span>/27</span>
    <button type="button" id="go">Keep the last shot</button>
  </div>
</main>
<script src="shared/sounds.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Roll complete', 'v0.1');
const V = Poto.panel('roll-complete', [
  { key: 'beat_ms', label: 'Beat before', min: 0, max: 800, step: 10, value: 300, unit: 'ms' },
  { key: 'rewind_ms', label: 'Rewind', min: 500, max: 2500, step: 50, value: 1300, unit: 'ms' },
  { key: 'wipe_ms', label: 'Screen change', min: 150, max: 900, step: 10, value: 420, unit: 'ms' },
  { key: 'eject_ms', label: 'Canister rise', min: 150, max: 900, step: 10, value: 460, unit: 'ms' },
  { key: 'stagger_ms', label: 'Text stagger', min: 0, max: 300, step: 10, value: 90, unit: 'ms' },
]);
const $ = (id) => document.getElementById(id), odo = $('odo'), cam = $('cam'), can = $('can');
const paint = (n) => { odo.innerHTML = String(n).padStart(2, '0').split('').map((c) => '<span class="d"><span>' + c + '</span></span>').join(''); };
function reset() { paint(27); cam.style.transform = ''; cam.style.display = 'flex'; ['t1', 't2', 't3', 't4'].forEach((i) => ($(i).style.opacity = 0)); can.style.transform = 'translateY(60px)'; $('go').style.visibility = 'visible'; }
reset();
async function play() {
  const rm = Poto.reduced(); $('go').style.visibility = 'hidden';
  await Poto.wait(rm ? 0 : V.beat_ms);
  if (!rm) {
    // 1. rewind: the counter runs back to 00 while the motor whirs. Fast in the middle, firm at both ends.
    const stop = Poto.play('advance', { rate: 1.9, loop: true, volume: 0.7 }); let last = 27, lastTick = 0;
    await Poto.run(V.rewind_ms, (t, ms) => { const n = Math.round(27 * (1 - t)); if (n !== last) { last = n; paint(n); if (ms - lastTick > 160) { lastTick = ms; Poto.haptic('Selection'); } } }, 'mechanical').done;
    stop(60); Poto.play('shutter', { rate: 0.6, volume: 0.8 }); Poto.haptic('Medium');
    await Poto.wait(220);
    // 2. the camera lifts away to the paper screen
    await cam.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], { duration: V.wipe_ms, easing: Poto.css('standard'), fill: 'forwards' }).finished;
  }
  cam.style.display = 'none';
  // 3. the finished canister rises out, and the words arrive one after another
  await can.animate([{ transform: 'translateY(60px)' }, { transform: 'translateY(0)' }], { duration: rm ? 0 : V.eject_ms, easing: 'cubic-bezier(.3,1.35,.5,1)', fill: 'forwards' }).finished;
  can.style.transform = 'none'; Poto.play('pat', { rate: 1.3 }); Poto.haptic('Success');
  ['t1', 't2', 't3', 't4'].forEach((id, i) => $(id).animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: rm ? 0 : 380, delay: rm ? 0 : 80 + i * V.stagger_ms, easing: Poto.css('standard'), fill: 'forwards' }));
}
$('go').onclick = play;
$('t4').onclick = () => { reset(); };
</script>
</body>
</html>
