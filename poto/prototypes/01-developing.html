<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poto · Developing reveal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/poto.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; }
  .variants { display: flex; gap: 6px; margin: 14px 0 0; }
  .variants button { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--ink-soft); }
  .variants button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .table { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 0; padding: 8px 20px 0; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .slot .mono { color: var(--ink-soft); }
  .card { position: relative; width: min(74vw, 318px, 46vh); padding: 3.6% 3.6% 0; will-change: transform, opacity; }
  .all .card { width: min(27.5vw, 122px); }
  .card canvas { display: block; width: 100%; aspect-ratio: 3 / 4; background: var(--blank-film); border-radius: 1px; }
  .card .cap { height: 0; padding-bottom: 10.5%; position: relative; }
  .card .cap span { position: absolute; left: 1%; top: 50%; transform: translateY(-50%); color: var(--ink-soft); opacity: 0; transition: opacity .6s ease; white-space: nowrap; color: #6B6B6B; }
  .all .card .cap span { display: none; }
  .card.done .cap span { opacity: 1; }
  .card .dev { position: absolute; left: 0; right: 0; top: 44%; text-align: center; color: #6B6B6B; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .card .dev.on { opacity: 1; }
  .actions { height: 96px; display: flex; align-items: flex-start; justify-content: center; gap: 12px; padding-top: 18px; width: 100%; }
  .actions button { height: 44px; min-width: 112px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s cubic-bezier(.2,0,0,1); pointer-events: none; }
  .actions.on button { opacity: 1; transform: none; pointer-events: auto; }
  .actions .keep { background: var(--ink); color: var(--paper); border-color: var(--ink); transition-delay: .06s; }
  .actions .again, .actions .undo { display: none; }
  .actions.after .keep, .actions.after .toss { display: none; }
  .actions.after .again { display: block; }
  .actions.tossed .undo { display: block; }
  body.tweaking .actions { visibility: hidden; }
  body.tweaking .table { align-items: flex-start; padding-top: 16px; }
  body.tweaking .table:not(.all) .card { width: min(50vw, 210px); }
</style>
</head>
<body>
<main class="stage">
  <div class="variants" role="group" aria-label="Reveal variant">
    <button type="button" data-v="A" aria-pressed="true">A · Chemistry</button>
    <button type="button" data-v="B" aria-pressed="false">B · Bloom</button>
    <button type="button" data-v="C" aria-pressed="false">C · Tray</button>
    <button type="button" data-v="all" aria-pressed="false">All</button>
  </div>
  <div class="table" id="table"></div>
  <div class="actions" id="actions">
    <button type="button" class="toss">Toss</button>
    <button type="button" class="keep">Keep</button>
    <button type="button" class="undo">Undo</button>
    <button type="button" class="again">Shoot again</button>
  </div>
</main>
<script src="shared/sounds.js"></script>
<script src="shared/develop-img.js"></script>
<script src="shared/poto.js"></script>
<script>
Poto.bar('Developing reveal', 'v0.1');
const V = Poto.panel('developing', [
  { key: 'develop_seconds', label: 'Develop time', min: 3, max: 12, step: 0.5, value: 8, unit: 's' },
  { key: 'hold', label: 'Blank hold', min: 0, max: 40, step: 1, value: 22, unit: '%' },
  { key: 'stagger', label: 'Tone stagger', min: 0, max: 1.5, step: 0.05, value: 0.85 },
  { key: 'colour_delay', label: 'Colour arrives', min: 0, max: 0.8, step: 0.05, value: 0.35 },
  { key: 'shimmer', label: 'Grain shimmer', min: 0, max: 1, step: 0.05, value: 0.45 },
  { key: 'easing', label: 'Curve', options: ['chemical', 'linear', 'standard', 'inOut'], value: 'chemical' },
  { key: 'rise_ms', label: 'Card rise', min: 150, max: 800, step: 10, value: 440, unit: 'ms' },
]);

let W = 300, H = 400;                         // internal resolution (halved in the 3-up view to keep 60 fps)
const BLANK = [233, 228, 218];                // tokens: blankFilm
const NAMES = { A: 'A · Chemistry', B: 'B · Bloom', C: 'C · Tray' };
const scenes = Object.keys(window.POTO_DEVELOP_IMG); let sceneIx = 0, mode = 'A', runs = [], stopShimmer = null, timers = [];
const table = document.getElementById('table'), actions = document.getElementById('actions');

function loadPixels(name) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.drawImage(im, 0, 0, W, H); res(x.getImageData(0, 0, W, H).data); };
    im.src = window.POTO_DEVELOP_IMG[name];
  });
}
// smooth low-frequency blotches (for B): a coarse random grid, smoothly interpolated
function blotches() {
  const gw = 5, gh = 6, g = Array.from({ length: (gw + 1) * (gh + 1) }, Math.random), out = new Float32Array(W * H);
  const s = (t) => t * t * (3 - 2 * t);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const fx = (x / W) * gw, fy = (y / H) * gh, ix = fx | 0, iy = fy | 0, tx = s(fx - ix), ty = s(fy - iy);
    const a = g[iy * (gw + 1) + ix], b = g[iy * (gw + 1) + ix + 1], c = g[(iy + 1) * (gw + 1) + ix], d = g[(iy + 1) * (gw + 1) + ix + 1];
    out[y * W + x] = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  }
  return out;
}
// "lateness" 0..1 per pixel: how long a pixel waits before it starts to appear
function lateness(variant, px) {
  const k = new Float32Array(W * H), n = variant === 'B' ? blotches() : null;
  for (let i = 0; i < W * H; i++) {
    const L = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
    if (variant === 'A') k[i] = 1 - L;                                     // highlights first, shadows deepen last
    else if (variant === 'C') k[i] = L * 0.9;                              // darkroom tray: shadows first
    else { const x = (i % W) / W - 0.5, y = ((i / W) | 0) / H - 0.5; k[i] = Poto.clamp(0.5 * n[i] + 0.25 * (1 - L) + 0.55 * Math.hypot(x, y)); }  // spreads from the middle, unevenly
  }
  return k;
}
const NOISE = new Int8Array(300 * 400 * 2).map(() => (Math.random() * 2 - 1) * 127);

function makeCard(variant, px) {
  const slot = document.createElement('div'); slot.className = 'slot';
  slot.innerHTML = '<div class="card print"><canvas width="' + W + '" height="' + H + '" role="img" aria-label="Photo developing"></canvas>' +
    '<div class="dev mono">Developing…</div><div class="cap"><span class="mono">Sunday · 15 Nov 2026</span></div></div>' + (mode === 'all' ? '<span class="mono">' + NAMES[variant] + '</span>' : '');
  table.appendChild(slot);
  const card = slot.querySelector('.card'), cv = slot.querySelector('canvas'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
  const k = lateness(variant, px), dev = slot.querySelector('.dev');
  for (let i = 3; i < d.length; i += 4) d[i] = 255;
  function draw(p, shimmerPhase) {
    const st = V.stagger, cd = V.colour_delay;
    let c = Poto.clamp((p - cd) / (1 - cd + 1e-6)); c = c * c * (3 - 2 * c);          // colour progress
    const gAmp = V.shimmer * 26 * Math.sin(Math.PI * Poto.clamp(p)) * (Poto.reduced() ? 0 : 1), off = (shimmerPhase * 7919) % (W * H);
    for (let i = 0, j = 0; i < W * H; i++, j += 4) {
      const p0 = (k[i] * st) / (1 + st); let a = Poto.clamp((p - p0) / (1 - p0)); a = a * a * (3 - 2 * a);
      const r = px[j], g = px[j + 1], b = px[j + 2], l = 0.299 * r + 0.587 * g + 0.114 * b;
      const tr = l * 1.04 + (r - l * 1.04) * c, tg = l + (g - l) * c, tb = l * 0.9 + (b - l * 0.9) * c;   // warm monochrome first, colour later
      const n = NOISE[i + off] * gAmp / 127 * (0.35 + a * 0.65);
      d[j] = BLANK[0] + (tr - BLANK[0]) * a + n; d[j + 1] = BLANK[1] + (tg - BLANK[1]) * a + n; d[j + 2] = BLANK[2] + (tb - BLANK[2]) * a + n;
    }
    ctx.putImageData(img, 0, 0);
  }
  draw(0, 0);
  card.addEventListener('click', () => { if (card.classList.contains('done')) return; dev.classList.add('on'); clearTimeout(dev._t); dev._t = setTimeout(() => dev.classList.remove('on'), 1200); });
  return { card, draw, slot, variant };
}

async function start() {
  runs.forEach((r) => r.cancel()); runs = []; timers.forEach(clearTimeout); timers = []; if (stopShimmer) stopShimmer(60);
  table.innerHTML = ''; table.classList.toggle('all', mode === 'all'); actions.className = 'actions';
  W = mode === 'all' ? 150 : 300; H = mode === 'all' ? 200 : 400;
  const px = await loadPixels(scenes[sceneIx % scenes.length]);
  const cards = (mode === 'all' ? ['A', 'B', 'C'] : [mode]).map((v) => makeCard(v, px));
  const reduced = Poto.reduced(), total = V.develop_seconds * 1000, hold = total * V.hold / 100, e = Poto.ease(V.easing);
  // 1. the card rises from the camera (paper curve), or just fades in under reduce motion
  cards.forEach(({ card }, i) => {
    if (reduced) { card.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, fill: 'both' }); return; }
    card.animate([{ transform: 'translateY(70vh) rotate(' + (i - 1) * 2 + 'deg)' }, { transform: 'translateY(0) rotate(' + ((Math.random() - 0.5) * 1.6).toFixed(2) + 'deg)' }],
      { duration: V.rise_ms, easing: Poto.css('paper'), fill: 'both', delay: i * 40 });
  });
  // 2. blank hold, then develop. One clock for all cards so "All" is a fair comparison.
  timers.push(setTimeout(() => { stopShimmer = Poto.play('shimmer', { loop: true, volume: 0.9 }); }, hold));
  const run = Poto.run(total, (_, ms) => {
    let p;
    if (reduced) p = Poto.clamp((ms - (total - 600)) / 600);                 // reduce motion: same wait, plain 600 ms cross-fade at the end
    else p = e(Poto.clamp((ms - hold) / (total - hold)));
    const phase = Math.floor(ms / 85);                                        // shimmer steps ~12 times a second: fizz, not TV static
    cards.forEach((c) => c.draw(p, phase));
  });
  runs.push(run);
  if (await run.done) {
    if (stopShimmer) stopShimmer(500);
    cards.forEach((c) => c.card.classList.add('done')); Poto.haptic('Light');
    if (mode === 'all') actions.className = 'actions on after'; else actions.className = 'actions on';
  }
}
function leave(kind) {
  const card = table.querySelector('.card'); if (!card) return;
  if (kind === 'keep') {
    Poto.haptic('Light');
    card.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(34vw, 52vh) scale(.16) rotate(8deg)', opacity: 0.2 }], { duration: Poto.reduced() ? 0 : 380, easing: Poto.css('standard'), fill: 'forwards' });
    actions.className = 'actions on after';
  } else {
    Poto.haptic('Rigid'); Poto.play('whoosh', { volume: 0.5, rate: 1.3 });
    card.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(-110vw, 6vh) rotate(-22deg)', opacity: 1 }], { duration: Poto.reduced() ? 0 : 420, easing: Poto.css('in'), fill: 'forwards' });
    actions.className = 'actions on after tossed';
    timers.push(setTimeout(() => actions.classList.remove('tossed'), 4000));
  }
}
actions.querySelector('.keep').onclick = () => leave('keep');
actions.querySelector('.toss').onclick = () => leave('toss');
actions.querySelector('.undo').onclick = () => {
  const card = table.querySelector('.card'); actions.className = 'actions on'; Poto.haptic('Light');
  card.animate([{ transform: 'translate(-110vw, 6vh) rotate(-22deg)' }, { transform: 'none' }], { duration: Poto.reduced() ? 0 : 360, easing: Poto.css('paper'), fill: 'forwards' });
};
actions.querySelector('.again').onclick = () => { sceneIx++; start(); };
document.querySelectorAll('.variants button').forEach((b) => (b.onclick = () => {
  mode = b.dataset.v; document.querySelectorAll('.variants button').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); start();
}));
start();
</script>
</body>
</html>
