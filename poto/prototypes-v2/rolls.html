<!doctype html>
<html lang="en">
<head>
<script src="lib/shell.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Poto · Cameras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* Cameras (Cody, 20 Nov): instead of films, cameras. Each has its own look, lenses and frames, stands on your shelf,
     and you can make it yours (body colour, leather, strap, a sticker). Finished rolls are filed below, in the frosted folders. */
  html, body { height: 100%; overflow: hidden; background: var(--room); }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 18px) 0 calc(var(--safe-bottom) + 120px); }
  .pad { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  h2.sec { margin: 26px 0 12px; font: 600 20px/1.2 var(--sans); letter-spacing: -.02em; color: var(--ink); }
  h2.sec:first-child { margin-top: 6px; } h2.sec small { font: 400 15px/1 var(--sans); color: var(--ink-3); margin-left: 6px; }
  /* the shelf: cameras standing on a ledge */
  .shelf { position: relative; display: flex; align-items: flex-end; gap: 22px; overflow-x: auto; scrollbar-width: none; padding: 18px max(24px, env(safe-area-inset-left, 0px)) 0; scroll-snap-type: x proximity; }
  .shelf::-webkit-scrollbar { display: none; }
  .ledge { height: 14px; margin: 0 0 6px; background: linear-gradient(#FFFFFF, #ECE8E0); box-shadow: 0 1px 0 rgba(26,25,23,.08), 0 10px 18px -10px rgba(20,20,30,.35); }
  .slot { flex: none; display: grid; justify-items: center; gap: 8px; background: none; border: 0; padding: 0 0 10px; scroll-snap-align: start; }
  .slot b { font: 500 13px/1 var(--sans); color: var(--ink); } .slot small { font: 400 12px/1 var(--sans); color: var(--ink-3); margin-top: -4px; }
  .slot.inuse small { color: var(--red); }
  .slot .cam { transition: transform .3s var(--spring); } .slot:active .cam { transform: translateY(-5px); }
  /* a camera, drawn: body in its colour and leather, a top plate, the lens, a window, sometimes a flash or a prism */
  .cam { position: relative; width: 112px; aspect-ratio: 1.55; --body: #E8B44C; --plate: #D9D9DE; }
  .cam .bd { position: absolute; left: 0; right: 0; bottom: 0; top: 18%; border-radius: 10px; background: var(--body); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.18), 0 10px 14px -8px rgba(0,0,0,.35); overflow: hidden; }
  .cam .bd::before { content: ""; position: absolute; left: 0; right: 0; top: 22%; bottom: 14%; background: var(--leather, none); opacity: .55; }
  .cam .tp { position: absolute; left: 6%; right: 6%; top: 8%; height: 18%; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, #F4F4F6, var(--plate) 60%, #B8B8BE); box-shadow: inset 0 1px 0 #fff; }
  .cam .sh { position: absolute; right: 14%; top: 0; width: 12%; height: 12%; border-radius: 3px 3px 0 0; background: linear-gradient(#cfcfd4, #9c9ca3); }
  .cam .ln { position: absolute; left: 50%; top: 56%; width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 38% 34%, #6f7c94 0 6%, #1d2230 18%, #0b0d12 46%, #2a2d34 47%, #15171c 60%, #4a4d55 61%, #222429 72%, #9c9ea6 73%, #3a3c42 80%);
    box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.15); }
  .cam .vw { position: absolute; left: 10%; top: 26%; width: 16%; height: 12%; border-radius: 3px; background: linear-gradient(135deg, #8fa0b8, #222833 60%); box-shadow: inset 0 0 0 1.5px #c9c9cf; }
  .cam .fl { position: absolute; right: 9%; top: 26%; width: 20%; height: 13%; border-radius: 3px; background: repeating-linear-gradient(90deg, #f6f6f6 0 2px, #dcdce0 2px 4px); box-shadow: inset 0 0 0 1.5px #c9c9cf; }
  .cam.slr .pr { position: absolute; left: 34%; right: 34%; top: -6%; height: 26%; clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, #ededf0, var(--plate)); }
  .cam.instant { aspect-ratio: 1.15; } .cam.instant .ln { width: 52%; top: 52%; } .cam.instant .tp { display: none; } .cam.instant .bd { top: 6%; border-radius: 14px; }
  .cam.toy .bd { border-radius: 16px; } .cam.toy .tp { left: 18%; right: 18%; border-radius: 8px 8px 0 0; }
  .cam .strap { position: absolute; top: 24%; width: 5%; height: 34%; background: var(--strap); border-radius: 2px; }
  .cam .strap.l { left: -3%; } .cam .strap.r { right: -3%; }
  .cam .stk { position: absolute; z-index: 2; right: 10%; bottom: 12%; width: 16%; aspect-ratio: 1; }
  .cam.big { width: min(64vw, 260px); }
  /* the shop's cameras: a price tag on the shelf edge */
  .slot.shop .cam { filter: saturate(.9); }
  /* finished rolls: the frosted folders */
  .done { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
  .roll { background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
  .roll b { display: block; margin-top: 8px; font: 600 15px/1.2 var(--sans); color: var(--ink); } .roll small { display: block; margin-top: 3px; font: 400 13px/1.2 var(--sans); color: var(--ink-2); }
  .folder .p img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  /* pushed screens */
  .push { position: fixed; inset: 0; z-index: 30; background: var(--room); transform: translateX(100%); transition: transform .38s var(--ease); display: flex; flex-direction: column; }
  .push.on { transform: none; }
  .ptop { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(var(--safe-top) + 8px) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px)); }
  .ptop h1 { margin: 0; text-align: center; font: 600 17px/1.2 var(--sans); color: var(--ink); } .ptop small { display: block; font: 400 12px/1.2 var(--sans); color: var(--ink-3); margin-top: 2px; }
  .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); } .back svg { width: 20px; height: 20px; position: relative; z-index: 1; }
  .cbody { flex: 1; overflow-y: auto; padding: 4px max(20px, env(safe-area-inset-left, 0px)) calc(var(--safe-bottom) + 120px); }
  .stagec { display: grid; justify-items: center; gap: 14px; padding: 8px 0 4px; }
  .stagec p { margin: 0; max-width: 300px; text-align: center; font: 400 15px/1.45 var(--sans); color: var(--ink-2); }
  /* the preview: one photo through this camera's look, lens and frame */
  .pv { width: min(56vw, 220px); margin: 6px auto 0; }
  .pv .fr { position: relative; background: #fff; box-shadow: 0 1px 2px rgba(20,20,30,.12), 0 18px 30px -18px rgba(20,20,30,.4); }
  .pv .win { position: relative; overflow: hidden; aspect-ratio: 3 / 4; }
  .pv .win img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease), filter .3s; }
  .pv .win.fish { border-radius: 50%; } .pv .win::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 calc(var(--vig, 0) * 60px) rgba(0,0,0,.55); }
  .pv .fr.none { padding: 0; } .pv .fr.border { padding: 6%; } .pv .fr.instant { padding: 6% 6% 24%; } .pv .fr.edge { padding: 9% 3%; background: #121212; }
  .pv .fr.edge::before, .pv .fr.edge::after { content: ""; position: absolute; left: 4%; right: 4%; height: 3.5%; background: repeating-linear-gradient(90deg, #f2efe6 0 6px, transparent 6px 12px); opacity: .85; }
  .pv .fr.edge::before { top: 2.5%; } .pv .fr.edge::after { bottom: 2.5%; }
  .pv .fr .ds { position: absolute; right: 9%; bottom: 8%; font: 600 12px/1 var(--mono); color: #FF8A2A; text-shadow: 0 0 4px rgba(255,120,40,.6); display: none; } .pv .fr.date .ds { display: block; } .pv .fr.date { padding: 0; }
  h3.opt { margin: 22px 0 10px; font: 600 15px/1.2 var(--sans); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { height: 36px; padding: 0 14px; border-radius: 999px; font: 500 14px/1 var(--sans); color: var(--ink); background: var(--room-2); }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--room); }
  .sw button { width: 34px; height: 34px; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(26,25,23,.15); }
  .sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--room), 0 0 0 4px var(--ink); }
  .cta { display: flex; gap: 8px; margin-top: 26px; }
  .cta button { flex: 1; height: 48px; border-radius: 999px; font: 600 15px/1 var(--sans); }
  .cta .main { background: var(--ink); color: var(--room); } .cta .main:disabled { opacity: .35; }
  .roll-pg iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--room); }
  .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(96px + var(--safe-bottom)); padding: 10px 16px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; font: 500 14px/1 var(--sans); color: var(--ink); transition: opacity .2s, transform .3s var(--spring); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); } .toast span { position: relative; z-index: 1; }
</style>
</head>
<body>
<main class="app">
  <div class="scroll" id="scroll">
    <div class="pad"><h2 class="sec">Your shelf</h2></div>
    <div class="shelf" id="shelf"></div><div class="ledge"></div>
    <div class="pad"><h2 class="sec">Finished rolls <small id="ndone"></small></h2><div class="done" id="done"></div></div>
  </div>
  <section class="push" id="campg" aria-hidden="true"><div class="ptop"><button type="button" class="glass back" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="ctitle"></h1><span></span></div><div class="cbody" id="cbody"></div></section>
  <section class="push roll-pg" id="rollpg" aria-hidden="true"><div class="ptop"><button type="button" class="glass back" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="rtitle"></h1><span></span></div><iframe id="rframe" title="The roll"></iframe></section>
  <div class="toast glass" id="toast" role="status"><span></span></div>
</main>
<script src="lib/paper.js"></script>
<script src="lib/texture.js"></script>
<script src="lib/canister.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  window.PotoTex && PotoTex.install();
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const toastEl = $('toast'), toast = (t) => { toastEl.firstChild.textContent = t; toastEl.classList.add('on'); clearTimeout(toastEl.t); toastEl.t = setTimeout(() => toastEl.classList.remove('on'), 1600); };
  const ph = (f, s) => typeof f === 'number' ? 'img/photo-' + String(f).padStart(2, '0') + (s || '') + '.jpg' : f.replace('.jpg', (s || '') + '.jpg');
  // ---- the cameras: each carries a look (lib/canister.js LOOKS), lenses and frames ----
  const LENS = { '28mm': { z: 1, v: 0.2 }, '35mm': { z: 1.15, v: 0.25 }, '50mm': { z: 1.35, v: 0.3 }, '85mm': { z: 1.75, v: 0.35 }, Fisheye: { z: 1.25, v: 0.8, fish: true }, Instant: { z: 1.1, v: 0.45 } };
  const FRAMES = { None: 'none', 'White border': 'border', Instant: 'instant', 'Film edge': 'edge', 'Date stamp': 'date' };
  const CAMS = [
    { id: 'Sunday', kind: 'compact', look: 'Sunday', body: '#E8B44C', lenses: ['35mm', '28mm'], frame: 'Date stamp', desc: 'A warm little point-and-shoot. Soft grain, late-afternoon skin.' },
    { id: 'Harbour', kind: 'range', look: 'Harbour', body: '#3E7C80', lenses: ['50mm', '35mm'], frame: 'White border', desc: 'A quiet rangefinder. Cool and clean; blues hold, whites stay white.' },
    { id: 'Flashbulb', kind: 'instant', look: 'Flashbulb', body: '#EDEDEF', lenses: ['Instant'], frame: 'Instant', desc: 'An instant camera with a hard flash. Bright, a little blown out.', price: '$1.99' },
    { id: 'Silver', kind: 'slr', look: 'Silver', body: '#232325', lenses: ['50mm', '85mm', 'Fisheye'], frame: 'Film edge', desc: 'A black-and-white SLR. Deep blacks, silver mid-tones.', price: '$2.99' },
    { id: 'Lido', kind: 'toy', look: 'Lido', body: '#7FB7D9', lenses: ['28mm', 'Fisheye'], frame: 'White border', desc: 'A plastic beach camera. Washed sky, sun in everything.', price: '$1.99' },
  ];
  const BODY = ['#E8B44C', '#3E7C80', '#C8553A', '#EDEDEF', '#232325', '#7FB7D9', '#8C6A4F', '#B9C7A4'];
  const LEATHER = { Smooth: 'none', Grain: 'radial-gradient(rgba(0,0,0,.35) 0.6px, transparent 0.8px) 0 0 / 3px 3px', Woven: 'repeating-linear-gradient(45deg, rgba(0,0,0,.25) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, rgba(0,0,0,.25) 0 1px, transparent 1px 4px)', Ribbed: 'repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px)' };
  const STRAP = { None: '', Black: '#1b1b1c', Tan: '#B07A4A', Red: '#B8442F' };
  const STICK = { None: '', Star: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#FFD84D" stroke="#fff" stroke-width="1.6"/></svg>', Heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.3 4.3 4.3 0 0119.5 10c0 5.4-7.5 10-7.5 10z" fill="#FF6B8B" stroke="#fff" stroke-width="1.6"/></svg>', Dot: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#5B8CFF" stroke="#fff" stroke-width="1.6"/></svg>' };
  let owned = store.get('poto.cams', null) || { Sunday: {}, Harbour: {} };   // per camera: { body, leather, strap, sticker, lens, frame }
  let inUse = (store.get('poto.roll', {}) || {}).look || 'Sunday';
  const save = () => { store.set('poto.cams', owned); };
  const cfg = (C) => Object.assign({ body: C.body, leather: 'Smooth', strap: 'None', sticker: 'None', lens: C.lenses[0], frame: C.frame }, owned[C.id] || {});
  function drawCam(C, o, big) {
    const el = document.createElement('div'); el.className = 'cam ' + C.kind + (big ? ' big' : ''); el.style.setProperty('--body', o.body); el.style.setProperty('--leather', LEATHER[o.leather] || 'none');
    el.innerHTML = (STRAP[o.strap] ? '<i class="strap l" style="--strap:' + STRAP[o.strap] + '"></i><i class="strap r" style="--strap:' + STRAP[o.strap] + '"></i>' : '') + '<i class="tp"></i><i class="sh"></i>' + (C.kind === 'slr' ? '<i class="pr"></i>' : '') + '<i class="bd"></i><i class="vw"></i>' + (C.kind !== 'slr' ? '<i class="fl"></i>' : '') + '<i class="ln"></i>' + (STICK[o.sticker] ? '<i class="stk">' + STICK[o.sticker] + '</i>' : '');
    return el;
  }
  function paintShelf() {
    $('shelf').innerHTML = '';
    CAMS.slice().sort((a, b) => (owned[b.id] ? 1 : 0) - (owned[a.id] ? 1 : 0)).forEach((C) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'slot' + (C.id === inUse ? ' inuse' : '') + (owned[C.id] ? '' : ' shop');
      b.appendChild(drawCam(C, cfg(C))); b.insertAdjacentHTML('beforeend', '<b>' + C.id + '</b><small>' + (C.id === inUse ? 'In use' : owned[C.id] ? cfg(C).lens : C.price) + '</small>');
      b.onclick = () => openCam(C); $('shelf').appendChild(b);
    });
  }
  // ---- a camera's page: preview, lenses, frames, make it yours, use it ----
  function openCam(C) {
    const has = !!owned[C.id], o = cfg(C), L = byLook(C.look);
    $('ctitle').textContent = C.id; const body = $('cbody'); body.innerHTML = '';
    const stage = document.createElement('div'); stage.className = 'stagec'; stage.appendChild(drawCam(C, o, true)); stage.insertAdjacentHTML('beforeend', '<p>' + C.desc + '</p>'); body.appendChild(stage);
    const pv = document.createElement('div'); pv.className = 'pv'; body.appendChild(pv);
    const paintPv = () => { const ln = LENS[o.lens] || LENS['35mm'], fr = FRAMES[o.frame] || 'none';
      pv.innerHTML = '<div class="fr ' + fr + '"><div class="win' + (ln.fish ? ' fish' : '') + '" style="--vig:' + ln.v + '"><img src="' + ph(L.sample, '-s') + '" alt="" style="filter:' + L.filt + ';transform:scale(' + ln.z + ')"></div><span class="ds">’ 26 11 20</span></div>'; };
    paintPv();
    const group = (title, items, key, swatch) => { const h = document.createElement('h3'); h.className = 'opt'; h.textContent = title; body.appendChild(h);
      const c = document.createElement('div'); c.className = 'chips' + (swatch ? ' sw' : ''); body.appendChild(c);
      items.forEach((it) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', String(o[key] === it));
        if (swatch) { b.style.background = it; b.setAttribute('aria-label', 'Body colour'); } else b.textContent = it;
        b.onclick = () => { o[key] = it; c.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); if (has) { owned[C.id] = Object.assign({}, o); save(); }
          if (key === 'lens' || key === 'frame') paintPv(); else stage.replaceChild(drawCam(C, o, true), stage.firstChild); };
        c.appendChild(b); }); };
    group('Lens', C.lenses, 'lens'); group('Frame', Object.keys(FRAMES), 'frame');
    if (has) { group('Body', BODY, 'body', true); group('Leather', Object.keys(LEATHER), 'leather'); group('Strap', Object.keys(STRAP), 'strap'); group('Sticker', Object.keys(STICK), 'sticker'); }
    const cta = document.createElement('div'); cta.className = 'cta';
    cta.innerHTML = has ? '<button type="button" class="main" id="use"' + (C.id === inUse ? ' disabled' : '') + '>' + (C.id === inUse ? 'In your camera' : 'Use this camera') + '</button>' : '<button type="button" class="main" id="buy">Buy for ' + C.price + '</button>';
    body.appendChild(cta);
    if (has && C.id !== inUse) $('use').onclick = () => { const r = store.get('poto.roll', {}) || {}; store.set('poto.roll', { look: C.look, shot: 0, n: (r.n || 4) + 1 }); store.set('poto.cam', { id: C.id, lens: o.lens, frame: o.frame }); inUse = C.id; paintShelf(); close($('campg')); toast(C.id + ' is in your camera'); try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} };
    if (!has) $('buy').onclick = () => { owned[C.id] = {}; save(); paintShelf(); openCam(C); toast(C.id + ' is on your shelf'); };
    open($('campg'));
  }
  // ---- finished rolls: frosted folders, the camera's swatch clipped on ----
  const CLIP = '<svg class="clip" viewBox="0 0 20 46" fill="none" stroke="#9a9aa2" stroke-width="2.4" stroke-linecap="round"><path d="M6 12v22a4 4 0 008 0V9a6 6 0 00-12 0v27a8 8 0 0016 0V14"/></svg>';
  const finished = store.get('poto.done', null) || [
    { look: 'Harbour', from: '2 Nov', to: '9 Nov', frames: [2, 5, 8, 11, 1, 4, 7, 10, 3, 6, 9, 12] },
    { look: 'Sunday', from: '18 Oct', to: '29 Oct', frames: [4, 9, 1, 6, 12, 3, 8, 2, 11, 5, 7, 10] },
    { look: 'Silver', from: '30 Sep', to: '12 Oct', frames: [7, 3, 10, 1, 8, 5, 12, 2, 9, 6, 11, 4] },
  ];
  function paintDone() {
    $('ndone').textContent = finished.length || ''; const D = $('done'); D.innerHTML = '';
    finished.forEach((r, i) => {
      const L = byLook(r.look), sw = 'linear-gradient(90deg,' + L.bg + ' 0 60%,#1b1b1c 60% 65%,' + L.band + ' 65%)', b = document.createElement('button'); b.type = 'button'; b.className = 'roll';
      b.innerHTML = '<div class="folder"><div class="board"></div>' + r.frames.slice(0, 3).map((f) => '<span class="p"><img src="' + ph(f, '-t') + '" alt="" loading="lazy"></span>').join('') + '<div class="pocket"></div><div class="swatch"><u style="background:' + sw + '"></u><i>' + r.look.toUpperCase() + '</i></div>' + CLIP + '<span class="n">ROLL ' + String(finished.length - i).padStart(2, '0') + '</span></div><b>' + r.look + '</b><small>' + (r.from ? r.from + ' – ' : '') + r.to + ' · ' + r.frames.length + ' frames</small>';
      b.onclick = () => { $('rtitle').innerHTML = r.look + '<small>' + (r.from ? r.from + ' – ' : '') + r.to + '</small>'; $('rframe').src = 'home.html?' + new URLSearchParams({ roll: r.look, frames: r.frames.join(',') }); open($('rollpg')); };
      D.appendChild(b); if (window.PotoTex && PotoTex.frostFolder) PotoTex.frostFolder(b);
    });
  }
  // ---- pushed screens ----
  const open = (el) => { el.classList.add('on'); el.setAttribute('aria-hidden', 'false'); };
  const close = (el) => { el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); };
  document.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => close(b.closest('.push'))));
  document.querySelectorAll('.push').forEach((el) => { let e0 = null; el.addEventListener('pointerdown', (e) => { if (e.clientX < 28) e0 = e.clientX; }); el.addEventListener('pointerup', (e) => { if (e0 != null && e.clientX - e0 > innerWidth * 0.3) close(el); e0 = null; }); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.push.on').forEach(close); });
  paintShelf(); paintDone();
})();
</script>
<link rel="stylesheet" href="lib/shell.css">
</body>
</html>
