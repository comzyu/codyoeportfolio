<!doctype html>
<html lang="en">
<head>
<script src="lib/shell.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Poto · Rolls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<style>
  /* Rolls (redesign plan, 20 Nov): which film is in your camera, the films you can load, and your finished rolls.
     A finished roll opens with its reel and the shuffle of its prints. */
  html, body { height: 100%; overflow: hidden; background: var(--room); }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: calc(var(--safe-top) + 18px) 0 calc(var(--safe-bottom) + 120px); }
  .pad { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
  h2.sec { margin: 26px 0 12px; font: 600 20px/1.2 var(--sans); letter-spacing: -.02em; color: var(--ink); }
  h2.sec:first-child { margin-top: 6px; }
  h2.sec small { font: 400 15px/1 var(--sans); color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
  /* in your camera */
  .incam { display: grid; grid-template-columns: 74px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 22px; background: #fff; box-shadow: 0 0 0 1px var(--hair), 0 18px 36px -24px rgba(20,20,30,.3); }
  .can-inner { position: relative; } .can-inner canvas { position: absolute; left: 0; top: -6.5%; width: 100%; height: 106.5%; }
  .incam .can { width: 74px; filter: drop-shadow(0 8px 8px rgba(0,0,0,.2)); }
  .incam b { display: block; font: 600 17px/1.2 var(--sans); color: var(--ink); }
  .incam .meta { display: block; margin-top: 4px; font: 400 14px/1.3 var(--sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .incam .bar { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; } .incam .bar i { display: block; height: 100%; border-radius: 4px; background: var(--ink); }
  .incam .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
  .btn { height: 40px; padding: 0 16px; border-radius: 999px; font: 500 14px/1 var(--sans); color: var(--ink); background: var(--room-2); }
  .btn.main { background: var(--ink); color: var(--room); }
  .btn.warn { background: var(--red); color: #fff; }
  /* films: a calm row of canisters */
  .films { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 6px max(20px, env(safe-area-inset-left, 0px)) 10px; scroll-snap-type: x proximity; }
  .films::-webkit-scrollbar { display: none; }
  .film { flex: none; width: 84px; background: none; border: 0; padding: 0; text-align: center; scroll-snap-align: start; }
  .film .can { width: 64px; margin: 0 auto; filter: drop-shadow(0 8px 8px rgba(0,0,0,.18)); transition: transform .3s var(--spring); }
  .film:active .can { transform: translateY(-4px) scale(.98); }
  .film b { display: block; margin-top: 10px; font: 500 13px/1.2 var(--sans); color: var(--ink); }
  .film small { display: block; margin-top: 3px; font: 400 12px/1 var(--sans); color: var(--ink-3); }
  .film.loaded small { color: var(--red); }
  /* finished rolls: folders, newest first */
  .done { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .folder { position: relative; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
  .folder .f { position: relative; aspect-ratio: 5 / 4; border-radius: 6px 14px 14px 14px; background: #EFEBE3; box-shadow: 0 0 0 1px var(--hair), 0 14px 26px -18px rgba(20,20,30,.35); overflow: hidden; }
  .folder .f::before { content: ""; position: absolute; left: 0; top: 0; width: 42%; height: 9%; border-radius: 6px 6px 0 0; background: var(--tab); }
  .folder .f .peek { position: absolute; left: 12%; right: 12%; top: 14%; display: flex; justify-content: center; }
  .folder .f .peek img { width: 46%; aspect-ratio: 3 / 4; object-fit: cover; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); margin: 0 -9%; }
  .folder .f .peek img:nth-child(1) { transform: rotate(-8deg) translateY(6%); } .folder .f .peek img:nth-child(3) { transform: rotate(8deg) translateY(6%); } .folder .f .peek img:nth-child(2) { position: relative; z-index: 1; }
  .folder .f .front { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; z-index: 2; background: linear-gradient(180deg, #F7F4EE, #F1EDE5); border-top: 1px solid rgba(26,25,23,.06); box-shadow: 0 -6px 12px -10px rgba(20,20,30,.3); }   /* the folder's front pocket */
  .folder .f .front i { position: absolute; left: 10px; bottom: 10px; width: 26px; height: 8px; border-radius: 4px; background: var(--tab); }
  .folder b { display: block; margin-top: 10px; font: 600 15px/1.2 var(--sans); color: var(--ink); }
  .folder small { display: block; margin-top: 3px; font: 400 13px/1.2 var(--sans); color: var(--ink-2); }
  .empty { padding: 22px; border-radius: 18px; border: 1px dashed rgba(26,25,23,.18); text-align: center; font: 400 15px/1.4 var(--sans); color: var(--ink-2); }
  /* pushed screens: a film's page, a finished roll */
  .push { position: fixed; inset: 0; z-index: 30; background: var(--room); transform: translateX(100%); transition: transform .38s var(--ease); display: flex; flex-direction: column; }
  .push.on { transform: none; }
  .ptop { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(var(--safe-top) + 8px) max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px)); }
  .ptop h1 { margin: 0; text-align: center; font: 600 17px/1.2 var(--sans); color: var(--ink); }
  .ptop small { display: block; font: 400 12px/1.2 var(--sans); color: var(--ink-3); margin-top: 2px; }
  .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
  .back svg { width: 20px; height: 20px; position: relative; z-index: 1; }
  .fbody { flex: 1; overflow-y: auto; padding: 8px max(20px, env(safe-area-inset-left, 0px)) calc(var(--safe-bottom) + 120px); text-align: center; }
  .fbody .can { width: 92px; margin: 10px auto 0; filter: drop-shadow(0 12px 12px rgba(0,0,0,.2)); }
  .fbody p { margin: 18px auto 0; max-width: 300px; font: 400 15px/1.45 var(--sans); color: var(--ink-2); }
  .samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0 0; }
  .samples img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 6px; }
  .fbody .btn { margin-top: 22px; height: 46px; padding: 0 26px; font-size: 15px; }
  .roll iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--room); }
  .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(96px + var(--safe-bottom)); padding: 10px 16px; transform: translate(-50%, 8px); opacity: 0; pointer-events: none; font: 500 14px/1 var(--sans); color: var(--ink); transition: opacity .2s, transform .3s var(--spring); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); } .toast span { position: relative; z-index: 1; }
</style>
</head>
<body>
<main class="app">
  <div class="scroll" id="scroll">
    <div class="pad"><h2 class="sec">In your camera</h2><div id="incam"></div></div>
    <div class="pad"><h2 class="sec">Films</h2></div>
    <div class="films" id="films"></div>
    <div class="pad"><h2 class="sec">Finished rolls <small id="ndone"></small></h2><div class="done" id="done"></div></div>
  </div>
  <section class="push" id="filmpg" aria-hidden="true"><div class="ptop"><button type="button" class="glass back" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="ftitle"></h1><span></span></div><div class="fbody" id="fbody"></div></section>
  <section class="push roll" id="rollpg" aria-hidden="true"><div class="ptop"><button type="button" class="glass back" data-close aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="rtitle"></h1><span></span></div><iframe id="rframe" title="The roll"></iframe></section>
  <div class="toast glass" id="toast" role="status"><span></span></div>
</main>
<script src="lib/paper.js"></script>
<script src="lib/texture.js"></script>
<script src="lib/canister.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  window.PotoTex && PotoTex.install();
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const toastEl = $('toast'), toast = (t) => { toastEl.firstChild.textContent = t; toastEl.classList.add('on'); clearTimeout(toastEl.t); toastEl.t = setTimeout(() => toastEl.classList.remove('on'), 1600); };
  const PRICE = { Flashbulb: '$1.99', Silver: '$1.99', Lido: '$2.99' };
  let owned = store.get('poto.films', ['Sunday', 'Harbour']);
  let roll = store.get('poto.roll', { look: 'Sunday', shot: 14, n: 4 }); if (!roll.look) roll = { look: 'Sunday', shot: 0, n: 4 };
  let finished = store.get('poto.done', null) || [
    { look: 'Harbour', from: '2 Nov', to: '9 Nov', frames: [2, 5, 8, 11, 1, 4, 7, 10, 3, 6, 9, 12] },
    { look: 'Sunday', from: '18 Oct', to: '29 Oct', frames: [4, 9, 1, 6, 12, 3, 8, 2, 11, 5, 7, 10] },
    { look: 'Silver', from: '30 Sep', to: '12 Oct', frames: [7, 3, 10, 1, 8, 5, 12, 2, 9, 6, 11, 4] },
  ];
  const save = () => { store.set('poto.roll', roll); store.set('poto.done', finished); store.set('poto.films', owned); };
  const ph = (f, s) => typeof f === 'number' ? 'img/photo-' + String(f).padStart(2, '0') + (s || '') + '.jpg' : f.replace('.jpg', (s || '') + '.jpg');
  const can = (look) => { const w = document.createElement('div'), c = makeCan(byLook(look)); w.className = 'can'; c.classList.add('can-inner'); c.style.width = '100%'; c.style.height = 'auto'; c.style.aspectRatio = '58 / 92'; w.appendChild(c); return w; };

  // ---- in your camera ----
  let finishing = false;
  function paintCam() {
    const el = $('incam'); el.innerHTML = '';
    const card = document.createElement('div'); card.className = 'incam';
    card.appendChild(can(roll.look));
    const info = document.createElement('div');
    info.innerHTML = '<b>' + roll.look + '</b><span class="meta">' + roll.shot + ' of 27 · ' + (27 - roll.shot) + ' left</span><div class="bar"><i style="width:' + (roll.shot / 27 * 100) + '%"></i></div>';
    card.appendChild(info);
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.innerHTML = '<button type="button" class="btn" id="change">Change film</button>' + (roll.shot ? '<button type="button" class="btn' + (finishing ? ' warn' : '') + '" id="finish">' + (finishing ? 'Finish ' + roll.look + '?' : 'Finish roll') + '</button>' : '');
    card.appendChild(acts); el.appendChild(card);
    $('change').onclick = () => $('films').scrollIntoView({ behavior: 'smooth', block: 'center' });
    const fin = $('finish'); if (fin) fin.onclick = () => {
      if (!finishing) { finishing = true; paintCam(); setTimeout(() => { if (finishing) { finishing = false; paintCam(); } }, 3000); return; }
      finishing = false;
      const mine = store.get('poto.kept', []).filter((o) => o.look === roll.look).map((o) => o.src).slice(0, 27);
      const d = new Date(), M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      finished.unshift({ look: roll.look, from: '', to: d.getDate() + ' ' + M[d.getMonth()], frames: mine.length ? mine : [3, 6, 9, 12, 1, 4] });
      roll = { look: roll.look, shot: 0, n: (roll.n || 4) + 1 }; save(); paintCam(); paintDone(); toast('Rolled up and filed');
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    };
  }
  // ---- films ----
  function paintFilms() {
    $('films').innerHTML = '';
    LOOKS.forEach((L) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'film' + (L.id === roll.look ? ' loaded' : '');
      b.appendChild(can(L.id));
      b.insertAdjacentHTML('beforeend', '<b>' + L.id + '</b><small>' + (L.id === roll.look ? 'In camera' : owned.includes(L.id) ? 'ISO ' + L.iso : PRICE[L.id] || '$1.99') + '</small>');
      b.onclick = () => openFilm(L); $('films').appendChild(b);
    });
  }
  function openFilm(L) {
    $('ftitle').textContent = L.id; const fb = $('fbody'); fb.innerHTML = ''; fb.appendChild(can(L.id));
    const has = owned.includes(L.id), inCam = L.id === roll.look;
    fb.insertAdjacentHTML('beforeend', '<p>' + L.desc + '</p><div class="samples">' + [L.sample, (L.sample % 12) + 3, (L.sample % 12) + 6].map((n) => '<img src="' + ph(((n - 1) % 12) + 1, '-s') + '" alt="" style="filter:' + L.filt + '">').join('') + '</div>' +
      '<button type="button" class="btn main" id="fact">' + (inCam ? 'In your camera' : has ? 'Load ' + L.id : 'Buy for ' + (PRICE[L.id] || '$1.99')) + '</button>');
    const a = $('fact'); if (inCam) a.disabled = true;
    a.onclick = () => {
      if (!has) { owned.push(L.id); save(); paintFilms(); openFilm(L); toast(L.id + ' is yours'); return; }
      if (roll.shot && !confirmLoad) { confirmLoad = true; a.textContent = 'Swap out ' + roll.look + ' (' + roll.shot + ' shots)?'; return; }
      confirmLoad = false; roll = { look: L.id, shot: 0, n: (roll.n || 4) + 1 }; save(); paintCam(); paintFilms(); close($('filmpg')); toast(L.id + ' loaded'); try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
    };
    open($('filmpg'));
  }
  let confirmLoad = false;
  // ---- finished rolls ----
  function paintDone() {
    $('ndone').textContent = finished.length || '';
    $('done').innerHTML = finished.length ? '' : '<div class="empty" style="grid-column:1/-1">Finished rolls are filed here.</div>';
    finished.forEach((r, i) => {
      const L = byLook(r.look), b = document.createElement('button'); b.type = 'button'; b.className = 'folder'; b.style.setProperty('--tab', L.bg);
      b.innerHTML = '<div class="f"><div class="peek">' + r.frames.slice(0, 3).map((f) => '<img src="' + ph(f, '-t') + '" alt="">').join('') + '</div><div class="front"><i></i></div></div><b>' + r.look + '</b><small>' + (r.from ? r.from + ' – ' : '') + r.to + ' · ' + r.frames.length + ' frames</small>';
      b.onclick = () => openRoll(r); $('done').appendChild(b);
    });
  }
  function openRoll(r) {
    $('rtitle').innerHTML = r.look + '<small>' + (r.from ? r.from + ' – ' : '') + r.to + '</small>';
    $('rframe').src = 'home.html?' + new URLSearchParams({ roll: r.look, frames: r.frames.join(',') });
    open($('rollpg'));
  }
  // ---- pushed screens: back button, or swipe from the left edge ----
  const open = (el) => { el.classList.add('on'); el.setAttribute('aria-hidden', 'false'); };
  const close = (el) => { el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); confirmLoad = false; };
  document.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => close(b.closest('.push'))));
  document.querySelectorAll('.push').forEach((el) => { let e0 = null;
    el.addEventListener('pointerdown', (e) => { if (e.clientX < 28) e0 = e.clientX; });
    el.addEventListener('pointerup', (e) => { if (e0 != null && e.clientX - e0 > innerWidth * 0.3) close(el); e0 = null; }); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.push.on').forEach(close); });
  paintCam(); paintFilms(); paintDone();
})();
</script>
<link rel="stylesheet" href="lib/shell.css">
</body>
</html>
