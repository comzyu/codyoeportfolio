<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Poto · The postcard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&family=Special+Elite&family=La+Belle+Aurore&display=swap">
<link rel="stylesheet" href="lib/ui.css">
<style>
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .tray { position: absolute; z-index: 6; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 14px) scale(.96); display: flex; gap: 4px; padding: 5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .4s var(--spring); }
  .tray.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .tray button { height: 40px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; position: relative; }
  .tray button i { width: 16px; height: 16px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .tray .holo i { background: conic-gradient(from 40deg, #9be7ff, #c9a4ff, #ffb3d1, #ffe9a3, #a8ffcf, #9be7ff); }
  .tray .gloss i { background: radial-gradient(circle at 35% 30%, #fff, #d9d9de 55%, #9b9ba3); }
  .tray .matte i { background: #cfcfd3; }
  .tray.open ~ .hint { opacity: 0; }
  /* writing: a small glass capsule rides along under the line, where the next letter will land */
  .cap { position: fixed; z-index: 7; left: 0; top: 0; width: 22px; height: 7px; margin: 6px 0 0 -2px; border-radius: 999px; pointer-events: none; opacity: 0;
    background: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 2px 6px rgba(20,20,30,.22), inset 0 -1px 0 rgba(20,20,30,.12);
    transition: transform .09s cubic-bezier(.2,.8,.2,1), opacity .25s, background .2s; will-change: transform; }
  .writing .cap { opacity: 1; } .cap.bell { background: rgba(255,214,120,.8); }
  .done { position: absolute; z-index: 8; right: max(18px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); height: 40px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 14px; color: #fff; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .25s; }
  /* selecting: soft highlight boxes on the card, and a small glass bar with Select all / Delete */
  .hl { position: fixed; z-index: 6; left: 0; top: 0; border-radius: 5px; background: rgba(70, 120, 255, .2); box-shadow: inset 0 0 0 1px rgba(70,120,255,.28); pointer-events: none; transform-origin: 0 0; }
  .edit { position: absolute; z-index: 8; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -6px); display: flex; gap: 2px; padding: 4px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .35s var(--spring); }
  .writing .edit { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .edit button { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink-2); position: relative; }
  .edit button.on { color: #fff; background: var(--ink); } .edit [hidden] { display: none; }
  .writing .done { opacity: 1; pointer-events: auto; } .writing .dock, .writing .hint, .writing .tray { opacity: 0 !important; pointer-events: none !important; }
  .left { position: absolute; z-index: 8; left: 0; right: 0; pointer-events: none; top: calc(26px + env(safe-area-inset-top, 0px)); text-align: center; opacity: 0; transition: opacity .25s; } .writing .left { opacity: 1; } .writing #side { opacity: 0; }
  #ta { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; resize: none; }
  .finish { height: 40px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--ink); min-width: 84px; }
  .writing .finish { opacity: 0; pointer-events: none; }
  /* sticker mode: a dashed ring round the picked sticker and a bar of actions */
  .ring { position: fixed; z-index: 6; left: 0; top: 0; border-radius: 50%; border: 1.5px dashed rgba(20,20,22,.55); pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: 0 0 0 4px rgba(255,255,255,.5); }
  .picking .ring { opacity: 1; }
  .sbar { position: absolute; z-index: 8; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); display: flex; align-items: center; gap: 2px; padding: 5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .35s var(--spring); }
  .picking .sbar { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); } .picking .dock, .picking .hint { opacity: 0 !important; pointer-events: none !important; }
  .sbar button { white-space: nowrap; height: 42px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--ink-2); position: relative; }
  .sbar button.on { color: #fff; background: var(--ink); }
  .shint { position: absolute; z-index: 8; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; } .picking .shint { opacity: 1; }
  /* four actions: tighter so the bar fits a 360 px phone */
  .dock { gap: 0; } .dock .sep { margin: 0; } .dock button { padding: 0 11px; gap: 6px; font-size: 13.5px; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 40px; text-align: center; color: var(--ink-2); }
  .share .capedit { gap: 6px; width: 100%; max-width: 420px; } .share .capedit input { flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 999px; padding: 0 14px; background: rgba(255,255,255,.7); font: 500 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <a class="glass round" style="color:inherit" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span class="mono soft" id="side">Front</span>
    <button type="button" class="glass finish" id="finish" aria-label="Photo finish">Matte</button>
  </header>
  <div id="stage" role="img" aria-label="A postcard you can turn, flip and put stickers on"></div>
  <div class="tray glass" id="tray" role="group" aria-label="Sticker finish">
    <button type="button" class="holo" data-f="holo"><i></i>Holographic</button>
    <button type="button" class="gloss" data-f="gloss"><i></i>Gloss</button>
    <button type="button" class="matte" data-f="matte"><i></i>Matte</button>
  </div>
  <p class="hint mono" id="hint">Drag to turn · tap to flip · peel a sticker off the back</p>
  <i class="cap" id="cap" aria-hidden="true"></i><i class="ring" id="ring" aria-hidden="true"></i>
  <p class="shint mono soft" id="shint">Drag to peel</p><div class="sbar glass" id="sbar" role="group" aria-label="Sticker"><button type="button" id="speel">Peel off</button><button type="button" id="sremove">Remove</button><button type="button" class="on" id="sdone">Done</button></div>
  <div class="edit glass" id="edit" role="group" aria-label="Edit text"><button type="button" id="selall">Select all</button><button type="button" id="del" class="on" hidden>Delete</button><button type="button" id="unsel" hidden>Cancel</button></div>
  <div id="hls" aria-hidden="true"></div>
  <button type="button" class="done" id="done">Done</button><span class="left mono soft" id="left"></span>
  <textarea id="ta" maxlength="150" aria-label="Message on the back of the postcard" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <nav class="dock glass" aria-label="Postcard">
    <button type="button" id="flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>Flip</button>
    <span class="sep"></span>
    <button type="button" id="write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>Write</button>
    <span class="sep"></span>
    <button type="button" id="stick" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a4 4 0 00-4 4v10a4 4 0 004 4h10a4 4 0 004-4v-7"/><path d="M14 3v4a3 3 0 003 3h4z"/></svg>Sticker</button>
    <span class="sep"></span>
    <button type="button" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>Share</button>
  </nav>
  <section class="share" id="sharesheet" aria-label="Share" aria-hidden="true">
    <div class="row glass" role="group" aria-label="Format"><button type="button" data-fmt="story" aria-pressed="true">Story 9:16</button><button type="button" data-fmt="post" aria-pressed="false">Post 4:5</button></div>
    <div class="row glass" role="group" aria-label="Side"><button type="button" data-side="front" aria-pressed="true">Front</button><button type="button" data-side="back" aria-pressed="false">Back</button><button type="button" data-side="both" aria-pressed="false">Both</button><button type="button" id="sedit" aria-pressed="false">Edit text</button></div>
    <div class="row glass capedit" id="capedit" hidden><input id="capL" aria-label="Left line: date" maxlength="40"><input id="capR" aria-label="Right line: place" maxlength="30"></div>
    <div class="stage" id="sstage"><div class="frame" id="sframe"><img id="simg" alt="The image to share"><i class="zone t" id="zt"></i><i class="zone b" id="zb"></i></div></div>
    <div class="foot"><button type="button" class="g" id="sguides" aria-pressed="false">Show safe zones</button><p id="shelp">Press and hold the picture to save it.</p><button type="button" class="x" id="sclose">Done</button></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="lib/paper.js"></script>
<script src="lib/postcard3d.js"></script>
<script src="lib/share.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id), stage = $('stage');
  if (!window.THREE || !document.createElement('canvas').getContext('webgl2')) { stage.innerHTML = '<p class="fallback">This needs WebGL, which this browser has switched off.</p>'; return; }
  // fonts have to be in before anything is drawn onto the card
  const fonts = ['37px "Special Elite"', '58px "La Belle Aurore"', '500 19px "IBM Plex Mono"', '700 120px "IBM Plex Mono"'];
  await Promise.race([Promise.all(fonts.map((f) => document.fonts.load(f))).catch(() => {}), new Promise((r) => setTimeout(r, 2500))]);
  const Q = new URLSearchParams(location.search), SRC = /^img\/photo-\d\d\.jpg$/.test(Q.get('src') || '') ? Q.get('src') : 'img/photo-04.jpg', ZOOM = Math.max(1, +Q.get('zoom') || 1), EV = Math.max(-2, Math.min(2, +Q.get('ev') || 0));
  const raw = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = SRC; });
  // re-make the print from the original: the same crop (zoom) and exposure you shot it with
  const PW = Math.min(1500, raw.width), PH = PW * 4 / 3;   // keep the photo at its own resolution (up to 1500 wide): no softening on the way in
  const photo = document.createElement('canvas'); photo.width = PW; photo.height = PH; { const x = photo.getContext('2d'), z = ZOOM > 1 ? ZOOM / 1.35 : 1, s = Math.max(PW / raw.width, PH / raw.height) * z;
    x.imageSmoothingQuality = 'high'; if (EV) x.filter = 'brightness(' + Math.pow(2, EV * 0.75).toFixed(3) + ')'; x.drawImage(raw, (PW - raw.width * s) / 2, (PH - raw.height * s) / 2, raw.width * s, raw.height * s); }
  if (document.referrer.includes('home.html')) document.querySelector('.top a').href = 'home.html';

  let W; const fronts = {};
  const pc = new PotoPostcard(stage, { lite: /[?&]lite/.test(location.search) });
  window.pc = pc;
  pc.setFaces(
    (fronts.matte = PotoPaper.front(photo, 'Sunday · 15 Nov 2026', 'matte')),
    (W = PotoPaper.backWriter(photo, { message: ['the lights came on all at', 'once and nobody said', 'anything for a minute.', '', 'you would have loved it.'], to: ['Dana Okafor', '14 Tiong Bahru Rd', 'Singapore 168732'], caption: 'Shot on Sunday · frame 14 of 27', city: 'Singapore', look: 'Sunday', date: ['15 NOV', '2026'] })).tex
  );
  pc.addSticker('star', 'holo', -0.29, 0.25, -0.16);              // back only. Card x is mirrored on the back: negative x is the right of the written side.
  const S = window.PotoSound || { play() {}, start() { return () => {}; } };
  pc.onFlip = (face, quiet) => { $('side').textContent = face ? 'Back' : 'Front'; if (!quiet) S.play('flip'); };
  pc.onLand = () => S.play('land');
  let stopPeel = null;
  pc.onPeelStart = () => { stopPeel = S.start('peel'); };
  pc.onLift = () => { if (stopPeel) stopPeel(); stopPeel = null; S.play('lift'); };
  pc.onPress = (how) => { if (stopPeel) stopPeel(); stopPeel = null; S.play('press', how); };
  pc.onRemove = () => S.play('lift');

  $('flip').onclick = () => pc.flip();
  // ---- share: Story 9:16 or Post 4:5, front / back / both ----
  const sh = { fmt: 'story', side: 'front', left: 'Sunday · 15 Nov 2026', right: 'Singapore' }, sheet = $('sharesheet');
  // the line under the card: filled in from the photo (its date, its place) and editable here
  $('capL').value = sh.left; $('capR').value = sh.right;
  $('sedit').onclick = () => { const on = $('capedit').hidden; $('capedit').hidden = !on; $('sedit').setAttribute('aria-pressed', String(on)); if (on) $('capL').focus(); };
  let capT = 0; const capIn = () => { sh.left = $('capL').value; sh.right = $('capR').value; clearTimeout(capT); capT = setTimeout(renderShare, 180); };
  $('capL').oninput = capIn; $('capR').oninput = capIn;
  function renderShare() {
    const front = (fronts[$('finish').textContent === 'Gloss' ? 'gloss' : 'matte'] || fronts.matte).col;
    const img = PotoShare.render({ format: sh.fmt, side: sh.side, front, photoRect: fronts.matte.photoRect, back: W.tex.col, stickers: pc.stickersFlat(), photo, left: sh.left, right: sh.right, handle: '@cody', mark: 'poto.app' });
    $('simg').src = img.toDataURL('image/jpeg', 0.96);
    const F = PotoShare.formats[sh.fmt], st = $('sstage'), fr = $('sframe'), k = Math.min((st.clientWidth) / F.w, (st.clientHeight - 20) / F.h);
    fr.style.width = F.w * k + 'px'; fr.style.height = F.h * k + 'px';
    $('zt').style.height = (sh.fmt === 'story' ? F.safeTop * k : 0) + 'px'; $('zb').style.height = (sh.fmt === 'story' ? F.safeBottom * k : 0) + 'px'; $('sguides').hidden = sh.fmt !== 'story';
  }
  $('share').onclick = () => { sheet.classList.add('on'); sheet.setAttribute('aria-hidden', 'false'); requestAnimationFrame(renderShare); };
  $('sclose').onclick = () => { sheet.classList.remove('on'); sheet.setAttribute('aria-hidden', 'true'); };
  sheet.querySelectorAll('[data-fmt]').forEach((b) => (b.onclick = () => { sh.fmt = b.dataset.fmt; sheet.querySelectorAll('[data-fmt]').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); renderShare(); }));
  sheet.querySelectorAll('[data-side]').forEach((b) => (b.onclick = () => { sh.side = b.dataset.side; sheet.querySelectorAll('[data-side]').forEach((o) => o.setAttribute('aria-pressed', String(o === b))); renderShare(); }));
  $('sguides').onclick = () => { const on = sheet.classList.toggle('guides'); $('sguides').setAttribute('aria-pressed', String(on)); };
  window.addEventListener('resize', () => { if (sheet.classList.contains('on')) renderShare(); });
  // two finishes for the picture side, to compare: printed on the card (matte) or instant-film gloss
  $('finish').onclick = () => {
    const next = $('finish').textContent === 'Matte' ? 'gloss' : 'matte';
    fronts[next] = fronts[next] || PotoPaper.front(photo, 'Sunday · 15 Nov 2026', next);
    pc.setFaces(fronts[next], null); $('finish').textContent = next === 'gloss' ? 'Gloss' : 'Matte'; if (pc.face() !== 0) pc.flip(0);
  };

  // ---- writing on the back ----
  window.W = W;
  const ta = $('ta'), cap = $('cap'), app = document.querySelector('.app'), left = $('left'), START = W.laid.map((g) => g.ch).join('');
  ta.value = 'the lights came on all at\nonce and nobody said\nanything for a minute.\n\nyou would have loved it.';
  let prev = ta.value, belled = -1, capRaf = 0;
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function placeCap() {                                  // the capsule follows the next letter, every frame while writing (the card is still settling)
    cancelAnimationFrame(capRaf); if (!app.classList.contains('writing')) return;
    const c = ta.selectionStart >= ta.value.length ? W.caret : W.caretAt(ta.selectionStart), a = pc.backToScreen(c.x, c.y + 8), b = pc.backToScreen(c.x + W.adv, c.y + 8);
    cap.style.width = Math.max(10, Math.hypot(b.x - a.x, b.y - a.y) * 1.05) + 'px'; cap.style.transform = 'translate(' + a.x + 'px,' + a.y + 'px)';
    // selection: highlight the selected words right on the card; the capsule steps aside
    const s0 = ta.selectionStart, s1 = ta.selectionEnd, sel = s1 > s0 && document.activeElement === ta;
    cap.style.opacity = sel ? 0 : ''; $('selall').hidden = sel; $('del').hidden = $('unsel').hidden = !sel;
    const boxes = sel ? W.boxes(s0, s1) : [];
    while (hls.children.length < boxes.length) hls.appendChild(Object.assign(document.createElement('i'), { className: 'hl' }));
    [...hls.children].forEach((el, k) => { const bx = boxes[k]; if (!bx) { el.style.display = 'none'; return; } const p = pc.backToScreen(bx.x, bx.y), q = pc.backToScreen(bx.x + bx.w, bx.y + bx.h);
      el.style.display = ''; el.style.width = Math.abs(q.x - p.x) + 'px'; el.style.height = Math.abs(q.y - p.y) + 'px'; el.style.transform = 'translate(' + Math.min(p.x, q.x) + 'px,' + Math.min(p.y, q.y) + 'px)'; });
    capRaf = requestAnimationFrame(placeCap);
  }
  function startWriting() { app.classList.add('writing'); pc.writing(true); ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); left.textContent = (150 - ta.value.length) + ' left'; placeCap(); }
  const hls = $('hls');
  $('selall').onclick = () => { ta.focus({ preventScroll: true }); ta.select(); buzz(5); };
  $('unsel').onclick = () => { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); };
  $('del').onclick = () => { ta.focus({ preventScroll: true }); ta.setRangeText('', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); buzz(10); };
  function stopWriting() { app.classList.remove('writing'); pc.writing(false); ta.blur(); cancelAnimationFrame(capRaf); }
  $('write').onclick = startWriting; $('done').onclick = stopWriting;
  // ---- sticker mode ----
  let ringRaf = 0; const ring = $('ring');
  function trackRing() { const s = pc.selected(); cancelAnimationFrame(ringRaf); if (!s || s.state === 'gone') return; const q = pc.stickerScreen(s), r = q.r * 1.12;
    ring.style.width = ring.style.height = r * 2 + 'px'; ring.style.transform = 'translate(' + (q.x - r) + 'px,' + (q.y - r) + 'px)'; ringRaf = requestAnimationFrame(trackRing); }
  pc.onSelect = (s) => { app.classList.toggle('picking', !!s); $('shint').textContent = 'Drag to peel'; if (s) { buzz(6); trackRing(); } else cancelAnimationFrame(ringRaf); };
  $('speel').onclick = () => { pc.peelSelected(); $('shint').textContent = 'Tap where it goes'; };
  $('sremove').onclick = () => pc.removeSelected();
  $('sdone').onclick = () => pc.select(null);
  // pick words with your finger: tap a word to select it, drag across words to select them all, tap a gap to move the cursor there
  const wordSeg = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
  function wordAt(i) {
    const txt = ta.value; if (wordSeg) for (const w of wordSeg.segment(txt)) if (i >= w.index && i < w.index + w.segment.length) return [w.index, w.index + w.segment.length];
    let a = i, b = i; while (a > 0 && !/\s/.test(txt[a - 1])) a--; while (b < txt.length && !/\s/.test(txt[b])) b++; return [a, b];
  }
  let anchor = null;
  pc.onWritePointer = (type, e, moved) => {
    const p = pc.screenToBack(e), hit = p ? W.indexAt(p.x, p.y) : null;
    if (type === 'down') { anchor = hit; return; }
    if (type === 'move' && moved && anchor && hit) {
      const a = wordAt(Math.min(anchor.i, hit.i)), b = wordAt(Math.max(anchor.i, hit.i) - (hit.on || hit.i <= anchor.i ? 0 : 1));
      ta.setSelectionRange(Math.min(a[0], b[0]), Math.max(a[1], b[1])); return;
    }
    if (type === 'up') {
      ta.focus({ preventScroll: true });
      if (!moved && hit) { if (hit.on) { const [a, b] = wordAt(hit.i); ta.setSelectionRange(a, b); buzz(5); } else ta.setSelectionRange(hit.i, hit.i); }
      anchor = null;
    }
  };
  ta.addEventListener('input', () => {
    const r = W.set(ta.value);
    if (!r.ok) { ta.value = prev; buzz([8, 40, 8]); return; }       // the card is full: the carriage won't go further
    if (r.dirty) pc.updateBackRegion(r.dirty);
    const grew = ta.value.length > prev.length, last = ta.value[ta.value.length - 1];
    if (grew) {
      if (r.newline) { pc.nudge('return'); buzz(14); S.play('return'); belled = -1; }
      else if (last === ' ') { pc.nudge('key'); buzz(4); S.play('space'); }
      else { pc.nudge('key'); buzz(6); S.play('key'); }
      if (r.nearEnd && belled !== r.caret.line) { belled = r.caret.line; pc.nudge('bell'); buzz([5, 30, 5]); S.play('bell'); cap.classList.add('bell'); setTimeout(() => cap.classList.remove('bell'), 380); }
    } else { buzz(3); S.play('back'); }
    prev = ta.value; left.textContent = (150 - ta.value.length) + ' left';
  });
  // keep the card above the phone keyboard
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { document.getElementById('stage').style.height = app.classList.contains('writing') ? visualViewport.height + 'px' : ''; });
  const tray = $('tray'), stick = $('stick'); let kinds = ['heart', 'dot', 'star'], n = 0;
  stick.onclick = () => { const o = tray.classList.toggle('open'); stick.setAttribute('aria-expanded', String(o)); stick.classList.toggle('on', o); };
  let adding = false;
  tray.querySelectorAll('button').forEach((b) => (b.onclick = async () => {
    tray.classList.remove('open'); stick.classList.remove('on'); stick.setAttribute('aria-expanded', 'false');
    if (pc.stickers.length >= 5 || adding) return; adding = true;
    if (pc.face() !== 1) { pc.flip(1); await new Promise((r) => setTimeout(r, 700)); }          // stickers only go on the back: turn it over first
    // lands somewhere in the open space, a little crooked, laid down from one edge
    const spots = [[-0.3, 0.25], [0.22, 0.24], [-0.28, -0.05], [0.3, -0.52], [-0.05, 0.27]], free = spots.filter(([x, y]) => !pc.stickers.some((s) => Math.hypot(s.x - x, s.y - y) < 0.2));
    const [x, y] = free[0] || spots[n % spots.length];
    const s = pc.addSticker(kinds[n++ % 3], b.dataset.f, x, y, (Math.random() - 0.5) * 0.4);
    s.u.uPeel.value = 1; s.u.uFoldD.value.set(0.8, 0.6); s.u.uFoldR.value = 0.03; pc.onPress(1);
    const t0 = performance.now(); (function go(now) { const t = Math.min(1, (now - t0) / 320), e = 1 - Math.pow(1 - t, 3); s.u.uFoldP.value.set(0.8, 0.6).multiplyScalar(-0.26 + e * 0.56); if (t < 1) requestAnimationFrame(go); else { s.u.uPeel.value = 0; adding = false; } })(t0);
  }));
  setTimeout(() => ($('hint').style.opacity = 0), 9000);
})();
</script>
