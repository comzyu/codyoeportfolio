<style>
  /* Gallery white. Type and glass stay quiet; prints and folders are the only things with material. */
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: calc(64px + var(--safe-top)) 0 calc(120px + var(--safe-bottom)); }
  .pad { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
  .month { display: flex; align-items: baseline; gap: 10px; }
  .month h2 { margin: 0; font-size: 40px; line-height: 44px; font-weight: 600; letter-spacing: -0.035em; }
  .month span { font-size: 40px; line-height: 44px; font-weight: 300; letter-spacing: -0.03em; color: var(--ink-3); }
  .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  h3 { margin: 40px 0 0; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; display: flex; justify-content: space-between; align-items: baseline; }
  h3 small { font: 400 10.5px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }

  /* a print: thick white paper, an emulsion edge, a shadow with two parts (tight contact + soft fall) */
  .p { position: absolute; display: block; background: #FDFCFA; padding: 4% 4% 13%; border-radius: 2.5px; will-change: transform;
    box-shadow: inset 0 0 0 .5px rgba(0,0,0,.05), 0 .5px 0 rgba(0,0,0,.12), 0 1px 1.5px rgba(20,20,30,.16), 0 10px 22px -8px rgba(20,20,30,.28), 0 26px 40px -24px rgba(20,20,30,.22); }
  .p img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
  .p::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,0) 38%); }

  /* this week: a stack you flick through (references: Cody's board #8, #12, #0). The print you're on faces you;
     the rest stand on edge like spines in a box. Driven by its own physics, not page scroll: momentum, then a soft spring onto a print. */
  .cat { position: relative; height: 330px; margin-top: 6px; perspective: 900px; perspective-origin: 50% 45%; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; outline: none; }
  .cat:active { cursor: grabbing; }
  .cat .c { position: absolute; left: 50%; top: 14px; width: 168px; margin-left: -84px; transform-style: preserve-3d; will-change: transform; backface-visibility: hidden; }
  .cat .c .p { position: relative; width: 100%; }
  /* shading on cards that turn away: its own layer, changed only through opacity (no repaint) */
  .cat .c .sh { position: absolute; inset: 0; border-radius: 2.5px; z-index: 2; pointer-events: none; opacity: 0; will-change: opacity; background: linear-gradient(90deg, rgba(0,0,0,.3), rgba(0,0,0,.05)); }
  .cat .c .sh.r { background: linear-gradient(270deg, rgba(0,0,0,.3), rgba(0,0,0,.05)); }
  .cat .c .p { box-shadow: 0 1px 2px rgba(20,20,30,.16), 0 14px 26px -14px rgba(20,20,30,.32); will-change: auto; }
  .cat .date { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; color: var(--ink-3); transition: opacity .2s; }
  /* the reel: a photo disc you spin (Cody's board #5). Each window holds a print; the one under the pointer is "in the projector". */
  .reelwrap { position: relative; display: grid; place-items: center; margin: 8px 0 4px; }
  /* the disc is one canvas, drawn once (paper, print, windows); spinning only rotates that one layer */
  .reel { position: relative; width: min(84vw, 330px); aspect-ratio: 1; border-radius: 50%; touch-action: none; cursor: grab; will-change: transform; outline: none;
    box-shadow: 0 2px 3px rgba(20,20,30,.12), 0 22px 40px -22px rgba(20,20,30,.38); }
  .reel canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .reel:focus-visible { box-shadow: 0 0 0 2px var(--ink), 0 22px 40px -22px rgba(20,20,30,.38); }
  .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border: 8px solid transparent; border-top: 11px solid var(--ink); border-bottom: 0; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); z-index: 2; }
  .lamp { position: absolute; top: -2px; left: 50%; width: 34%; height: 46%; transform: translateX(-50%); pointer-events: none; z-index: 1; opacity: 0; transition: opacity .35s;
    background: radial-gradient(60% 46% at 50% 18%, rgba(255,248,226,.42), rgba(255,248,226,0) 70%); }
  .reelwrap.lit .lamp { opacity: 1; }

  /* the month (board #15): a ring-bound wall calendar. Top half the photo, bottom half the days, both the same height,
     so a page flips up over the rings and its back becomes the next month's photo, like the real thing. */
  .mhead { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; }
  .mhead h3 { margin: 0; } .mhead .nav { display: flex; gap: 6px; } .mhead .nav button { width: 34px; height: 34px; }
  .mhead .nav svg { width: 15px; height: 15px; } .mhead .nav button:disabled { opacity: .35; cursor: default; }
  .mcal { position: relative; margin-top: 14px; perspective: 1600px; touch-action: pan-y; }
  .mcal .half { position: relative; overflow: hidden; z-index: 0; }   /* explicit z-index, or Chrome paints the photo over the turning page */
  .mcal .top { border-radius: 18px 18px 0 0; background: #111; }
  .mcal .bot { border-radius: 0 0 18px 18px; }
  .mcal .wall { position: absolute; inset: 0; border-radius: 18px; box-shadow: 0 0 0 1px var(--hair), 0 20px 40px -26px rgba(20,20,30,.35); pointer-events: none; }
  .hero { position: absolute; inset: 0; background: #111; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .45s; }
  .hero::before, .hero::after { content: ""; position: absolute; left: 0; right: 0; height: 30%; pointer-events: none; z-index: 1; }      /* soft scrims so the month and date read on any photo */
  .hero::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,.38), rgba(0,0,0,0)); } .hero::after { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,.34), rgba(0,0,0,0)); }
  .hero span { z-index: 2; }
  .hero .m { position: absolute; left: 18px; top: 14px; color: #fff; font: 400 26px/1 var(--sans); letter-spacing: -.01em; text-shadow: 0 1px 2px rgba(0,0,0,.35), 0 1px 12px rgba(0,0,0,.4); }
  .hero .y { position: absolute; right: 18px; top: 18px; color: rgba(255,255,255,.85); font: 500 11px/1 var(--mono); letter-spacing: .12em; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .hero .d { position: absolute; left: 18px; bottom: 22px; color: rgba(255,255,255,.92); font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .page { padding: 16px 12px 14px; background: linear-gradient(180deg, rgba(0,0,0,.025), rgba(0,0,0,0) 14px), var(--paper-white, #FCFBF8) 0 0 / 256px 256px; }
  .leaf { position: absolute; left: 0; right: 0; transform-origin: 50% 0; transform-style: preserve-3d; will-change: transform; z-index: 3; pointer-events: none; }
  .leaf > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .leaf .fr { border-radius: 0 0 18px 18px; } .leaf .bk { transform: rotateX(180deg); border-radius: 18px 18px 0 0; }
  .leaf .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .leaf .fr .shade { background: linear-gradient(180deg, rgba(20,20,30,.05), rgba(20,20,30,.35)); } .leaf .bk .shade { background: linear-gradient(0deg, rgba(20,20,30,.05), rgba(20,20,30,.4)); }
  .mcal .cast { position: absolute; left: 0; right: 0; height: 50%; pointer-events: none; opacity: 0; z-index: 2; }
  .mcal .rings { position: absolute; left: 0; right: 0; height: 22px; display: flex; justify-content: space-between; padding: 0 9%; z-index: 5; pointer-events: none; }
  .mcal .rings i { width: 9px; height: 22px; border-radius: 6px; border: 2px solid #b9b9bf; border-left-color: #e9e9ee; border-right-color: #8f8f96; background: transparent; box-shadow: 0 1px 1px rgba(0,0,0,.15); }
  .mcal .rings i:nth-child(n+4):nth-child(-n+5) { visibility: hidden; }
  .mshare { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .mshare button { height: 36px; padding: 0 16px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
  .mshare svg { width: 15px; height: 15px; position: relative; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--ink-3); padding: 6px 0 6px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--hair); border-left: 1px solid var(--hair); }
  .cal > * { position: relative; aspect-ratio: 1; border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); overflow: hidden; }
  .cal .d { cursor: pointer; padding: 0; background: none; } .cal .d img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cal .d b { position: absolute; right: 3px; top: 2px; z-index: 1; font: 500 9px/11px var(--sans); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .cal .d.has b { color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.6); }
  .cal .d.today::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--ink); }
  .cal .d.sel::before { content: ""; position: absolute; inset: 0; z-index: 2; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px var(--ink); }

  .dock button[aria-pressed="true"] { background: rgba(20,20,22,.07); color: var(--ink); box-shadow: none; }
  .dock .cam { width: 52px; height: 52px; min-width: 52px; padding: 0; margin: -4px 2px; justify-content: center; background: var(--ink); color: #fff; box-shadow: 0 6px 14px -4px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  .dock .cam i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; display: block; }
</style>

<main class="app">

    <a class="glass round" style="color:inherit" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>

    <a class="cam" href="camera.html" aria-label="Camera" style="border-radius:999px;display:inline-flex;align-items:center"><i></i></a>
    <a href="rolls.html" style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none"><svg style="width:19px;height:19px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5a2 2 0 012-2h4l2 2h7a2 2 0 012 2v7a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>Rolls</a>
  </nav>
  <section class="share" id="sharesheet" aria-label="Share the month" aria-hidden="true">

    <div class="stage" id="sstage"><div class="frame" id="sframe"><img id="simg" alt="Your month, as an image to share"><i class="zone t" id="zt"></i><i class="zone b" id="zb"></i></div></div>
    <div class="foot"><button type="button" class="g" id="sguides" aria-pressed="false">Show safe zones</button><p>Press and hold the picture to save it.</p><button type="button" class="x" id="sclose">Done</button></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
PotoTex.install();
const th = (n) => 'img/photo-' + String(n).padStart(2, '0') + '-t.jpg';   // tiny: disc windows, calendar days
const ph = (n) => 'img/photo-' + String(n).padStart(2, '0') + '-s.jpg';
let seed = 27; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

// ---- this week: the stack ----
let kept = []; try { kept = JSON.parse(localStorage.getItem('poto.kept') || '[]'); } catch (e) {}
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const COUNT = Math.max(1, Math.min(200, +new URLSearchParams(location.search).get('n') || 12));   // ?n=5 or ?n=40 to see the diary with fewer or more prints
const ORDER = [4, 9, 1, 6, 12, 3, 8, 2, 11, 5, 7, 10];
const items = kept.slice(0, COUNT).concat(Array.from({ length: COUNT }, (_, k) => ({ src: 'img/photo-' + String(ORDER[k % 12]).padStart(2, '0') + '.jpg', zoom: 1, ev: 0, t: Date.UTC(2026, 10, 15 - Math.floor(k / 2), 12) }))).slice(0, COUNT);
const cat = $('cat'), N = items.length, look = (o) => (o.zoom > 1 ? 'transform:scale(' + (o.zoom / 1.35).toFixed(3) + ');' : '') + (o.ev ? 'filter:brightness(' + Math.pow(2, o.ev * 0.75).toFixed(3) + ')' : '');   // no filter unless the exposure was changed: filters on many images are what make phones stutter
const date = document.createElement('span'); date.className = 'date mono'; cat.appendChild(date);
cat.tabIndex = 0; cat.setAttribute('role', 'listbox'); cat.setAttribute('aria-label', "This week's prints. Swipe, or use the arrow keys.");
items.forEach((o, k) => {
  const sm = o.src.replace('.jpg', '-s.jpg');
  const c = document.createElement('div'); c.className = 'c'; c.setAttribute('role', 'option'); c.setAttribute('aria-label', 'Print ' + (k + 1) + ' of ' + N);
  c.innerHTML = '<span class="p"><span style="display:block;overflow:hidden;aspect-ratio:3/4"><img src="' + sm + '" alt="" draggable="false" decoding="async" style="' + look(o) + '"></span><i class="sh"></i></span>';
  o.sh = c.querySelector('.sh'); o.z = null; o.vis = null; o.r = null;
  o.el = c; cat.appendChild(c);
});
$('count').textContent = N + ' prints · swipe';

// motion state: pos is a float index (2.4 = between prints 2 and 3)
let pos = 0, vel = 0, target = null, dragging = false, raf = 0, shown = -1;
const CW = 168, G1 = 128, G2 = 13, SPINE = 76;              // card width, gap to first neighbour, spacing between spines, how far a spine turns
const clampPos = (p) => p < 0 ? p * 0.35 : p > N - 1 ? N - 1 + (p - N + 1) * 0.35 : p;   // past the ends it stretches, then springs back
let layout = function () {
  for (let k = 0; k < N; k++) {
    const o = items[k], c = o.el, d = k - pos, a = Math.abs(d), sg = Math.sign(d), near = Math.min(a, 1), far = Math.max(a - 1, 0);
    const vis = a <= 9; if (vis !== o.vis) { o.vis = vis; c.style.visibility = vis ? '' : 'hidden'; } if (!vis) continue;
    const x = sg * (near * G1 + far * G2), rot = -sg * near * SPINE, z = -near * 70 - far * 4, lift = (1 - near) * -6;
    c.style.transform = reduced ? 'translateX(' + x * 1.5 + 'px) scale(' + (1 - near * 0.2) + ')' : 'translate3d(' + x.toFixed(1) + 'px,' + lift.toFixed(1) + 'px,' + z.toFixed(1) + 'px) rotateY(' + rot.toFixed(2) + 'deg)';
    // only touch what changed: z-order and side flip rarely, shading through opacity (compositor-only)
    const zi = 100 - Math.round(a * 4); if (zi !== o.z) { o.z = zi; c.style.zIndex = zi; }
    const r = d < 0; if (r !== o.r) { o.r = r; o.sh.classList.toggle('r', r); }
    o.sh.style.opacity = (near * 0.9).toFixed(2);
  }
  const cur = Math.max(0, Math.min(N - 1, Math.round(pos)));
  if (cur !== shown) {
    if (shown !== -1 && !reduced) try { navigator.vibrate && navigator.vibrate(3); } catch (e) {}     // a soft tick as each print passes
    shown = cur; const d = new Date(items[cur].t || Date.now()); date.textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' Nov · ' + (cur + 1) + ' / ' + N;
    reelShow(cur); cat.setAttribute('aria-activedescendant', ''); items.forEach((o, k) => o.el.setAttribute('aria-selected', String(k === cur)));
  }
}
function tick(now) {
  raf = 0; const dt = Math.min(0.034, (now - (tick.t || now)) / 1000) || 0.016; tick.t = now;
  if (!dragging) {
    if (target == null) {                                      // coasting: friction, then pick the print we'll land on
      vel *= Math.exp(-4.2 * dt); pos += vel * dt;
      if (Math.abs(vel) < 2.2 || pos < -0.2 || pos > N - 0.8) target = Math.max(0, Math.min(N - 1, Math.round(pos + vel * 0.12)));
    }
    if (target != null) {                                      // a soft spring onto it (critically-ish damped: one tiny overshoot at most)
      const k = 140, c = 21; vel += ((target - pos) * k - vel * c) * dt; pos += vel * dt;
      if (Math.abs(target - pos) < 0.0015 && Math.abs(vel) < 0.01) { pos = target; vel = 0; target = null; layout(); tick.t = 0; return; }
    }
  }
  layout(); raf = requestAnimationFrame(tick);
}
const wake = () => { if (!raf) { tick.t = 0; raf = requestAnimationFrame(tick); } };
const go = (k) => { target = Math.max(0, Math.min(N - 1, k)); wake(); };

// drag with your finger; the stack follows 1:1, and a flick keeps going
let px = 0, pt = 0, downX = 0, downT = 0, moved = false, startPos = 0;
cat.addEventListener('pointerdown', (e) => { cat.setPointerCapture(e.pointerId); dragging = true; target = null; vel = 0; px = downX = e.clientX; pt = downT = performance.now(); moved = false; startPos = pos; wake(); });
cat.addEventListener('pointermove', (e) => {
  if (!dragging) return; const now = performance.now(), dx = e.clientX - px; if (Math.abs(e.clientX - downX) > 6) moved = true;
  const raw = startPos - (e.clientX - downX) / G1; pos = clampPos(raw);
  const v = -dx / G1 / Math.max(0.008, (now - pt) / 1000); vel = vel * 0.6 + v * 0.4; px = e.clientX; pt = now;
});
const release = (e) => {
  if (!dragging) return; dragging = false;
  if (!moved && performance.now() - downT < 300) {                // a tap: open the print you're on, or go to the one you tapped
    const hit = document.elementFromPoint(e.clientX, e.clientY), el = hit && hit.closest('.c'), k = items.findIndex((o) => o.el === el);   // the drag captured the pointer, so ask what's really under the finger
    if (k >= 0 && k === Math.round(pos)) return open(items[k], el);
    if (k >= 0) return go(k);
    return go(Math.round(pos));
  }
  vel = Math.max(-28, Math.min(28, vel)); wake();
};
cat.addEventListener('pointerup', release); cat.addEventListener('pointercancel', release);
cat.addEventListener('wheel', (e) => { e.preventDefault(); target = null; vel += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 0.02; wake(); }, { passive: false });
cat.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(Math.round(pos) + 1); else if (e.key === 'ArrowLeft') go(Math.round(pos) - 1); else if (e.key === 'Enter') open(items[Math.round(pos)], items[Math.round(pos)].el); });
// ---- the reel (board #5): spin the disc; it clicks round one window at a time, and the stack above follows like a projector ----
const reel = $('reel'), wrap = $('reelwrap'), WIN = 12, STEP = 360 / WIN;
// The disc always has 12 windows, like a real reel. With fewer prints the spare windows stay blank card; with more, the windows

// ---- the month (board #15): a wall calendar you flip. Each month: a hero photo on top, the days below; tap a day and it becomes the hero ----
const MNAME = ['jan.', 'feb.', 'mar.', 'apr.', 'may', 'jun.', 'jul.', 'aug.', 'sep.', 'oct.', 'nov.', 'dec.'], DOWN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const PLAN = { 1: 1, 2: 1, 4: 2, 5: 1, 7: 2, 8: 1, 9: 1, 11: 2, 12: 1, 13: 1, 14: 2, 15: 1 };
const dayPhoto = (d, m) => 1 + ((d * 5 + (m || 10) * 7) % 12);
const MONTHS = [7, 8, 9, 10].map((m) => {                       // Aug to Nov 2026 (Nov is now; earlier months are full)
  const first = new Date(2026, m, 1).getDay(), days = new Date(2026, m + 1, 0).getDate(), lead = (first + 6) % 7, plan = {};
  if (m === 10) Object.assign(plan, PLAN); else { let sd = m * 97; for (let d = 1; d <= days; d++) { sd = (sd * 16807) % 2147483647; if (sd % 100 < 48) plan[d] = 1 + (sd % 3); } }

let mi = MONTHS.length - 1, flipping = false;
const heroSrc = (M, d) => 'img/photo-' + String(dayPhoto(d, M.m)).padStart(2, '0') + '.jpg';
function heroHTML(M) {

{ let sx = 0, sy = 0, on = false; mcal.addEventListener('pointerdown', (e) => { on = true; sx = e.clientX; sy = e.clientY; });

// ---- share the month (board #4): the calendar as a Story or Post, the hero photo you picked on top ----
{

    $('simg').src = c.toDataURL('image/jpeg', 0.96);

    $('zt').style.height = (sh.fmt === 'story' ? F.safeTop * k : 0) + 'px'; $('zb').style.height = (sh.fmt === 'story' ? F.safeBottom * k : 0) + 'px'; $('sguides').hidden = sh.fmt !== 'story';
  }

[['Roll 03', 'Harbour', '27 frames · Oct', 'linear-gradient(90deg,#3E7C80 0 60%,#1b1b1c 60% 65%,#C9CED1 65%)', [7, 11, 5]], ['Roll 02', 'Sunday', '24 frames · Sep', 'linear-gradient(90deg,#E8B44C 0 62%,#1b1b1c 62% 66%,#C8553A 66%)', [8, 3, 10]],
