<title>Poto · Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Special+Elite&family=La+Belle+Aurore&display=swap">

<style>
  /* Home, minimal (Cody, 18 Nov): only the postcard. No header, no tabs, no words. A barely-there glass bar at the bottom.
     Tap the postcard to turn it over; swipe up for the next one. */
  :root { --room: #F4F2ED; --card: #FDFCF9; --ink: #18171A; --blue: #24314f; --hand: "La Belle Aurore", cursive; --mono: "IBM Plex Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: #E7E4DD; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .phone { position: relative; width: min(92vw, 390px); aspect-ratio: 390 / 844; border-radius: 48px; overflow: hidden; background: var(--room); isolation: isolate;
    box-shadow: 0 0 0 9px #111, 0 0 0 10px #333, 0 40px 60px -30px rgba(0,0,0,.5); touch-action: none; user-select: none; -webkit-user-select: none; container-type: inline-size; }
  .sb { position: absolute; z-index: 9; left: 0; right: 0; top: 0; height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font: 600 13px/1 -apple-system, system-ui, sans-serif; color: var(--ink); pointer-events: none; }
  .sb i { width: 90px; height: 24px; border-radius: 14px; background: #000; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); }
  /* the postcard, nothing else */
  .deck { position: absolute; inset: 0 0 64px; display: grid; place-items: center; perspective: 1600px; }
  .slot { position: absolute; width: 84%; max-height: 78%; aspect-ratio: 1024 / 1448; transform-style: preserve-3d; transition: transform .24s cubic-bezier(.2,.8,.2,1), opacity .24s; }
  .slot.under { transform: scale(.96) translateY(8px); opacity: .85; }
  .card { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.2,.45,1); }
  .card.over { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 3px; background: var(--card); overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,20,30,.12), 0 30px 50px -28px rgba(20,20,30,.45); }
  .front { padding: 4.2% 4.2% 0; }
  .front > img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .front u { position: absolute; right: 5.5%; bottom: 4.4%; font: 500 7px/1 var(--mono); letter-spacing: .16em; color: #b0aca5; text-decoration: none; }
  .st { position: absolute; right: 5%; top: 2.4%; width: 15%; aspect-ratio: 4 / 5; background: #FBFAF6; padding: 3px; transform: rotate(7deg); filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.25));
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 34%) -3px -3px / 6px 6px, linear-gradient(#000, #000) 3px 3px / calc(100% - 6px) calc(100% - 6px) no-repeat; mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 34%) -3px -3px / 6px 6px, linear-gradient(#000, #000) 3px 3px / calc(100% - 6px) calc(100% - 6px) no-repeat; }
  .st img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip { position: absolute; right: 12.4%; top: -1%; width: 4.4%; z-index: 2; transform: rotate(8deg); filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .back { transform: rotateY(180deg); background: #FAF8F2; }
  .back .msg { position: absolute; left: 8%; right: 8%; top: 32%; font: 400 clamp(15px, 6cqw, 23px)/1.6 var(--hand); color: var(--blue); }
  .back .sig { display: block; margin-top: 8%; }
  .back .st { right: 8%; top: 5%; width: 18%; transform: none; }
  .back .pm { position: absolute; right: 20%; top: 9%; width: 24%; aspect-ratio: 1; border-radius: 50%; border: 1.4px solid rgba(36,49,79,.4); transform: rotate(-12deg); }
  .back u { position: absolute; left: 8%; bottom: 6%; font: 500 7px/1 var(--mono); letter-spacing: .16em; color: #b0aca5; text-decoration: none; text-transform: uppercase; }
  .back u + u { left: auto; right: 8%; }
  /* the bar: there, but you hardly notice it */
  .bar { position: absolute; z-index: 8; left: 50%; bottom: calc(18px + var(--safe-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.12)); -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.08); backdrop-filter: blur(14px) saturate(200%) brightness(1.08); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.28), 0 1px 2px rgba(20,20,30,.06), 0 12px 32px -14px rgba(20,20,30,.32); }
  .bar button { position: relative; width: 44px; height: 40px; display: grid; place-items: center; color: rgba(24,23,26,.56); border-radius: 999px; transition: color .2s; }
  .bar button.on { color: rgba(24,23,26,.92); }
  .bar .lab { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translate(-50%, 4px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .2s; white-space: nowrap;
    padding: 4px 8px; border-radius: 999px; font: 500 11px/1 -apple-system, system-ui, sans-serif; color: #1A1917; background: rgba(255,255,255,.75); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .bar button.say .lab, .newbie .bar .lab { opacity: 1; transform: translate(-50%, 0); }
  .newbie .bar .lab { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; bottom: auto; top: calc(100% - 2px); font-size: 9.5px; color: rgba(24,23,26,.55); padding: 0; }
  .newbie .bar { padding-bottom: 14px; } .newbie .bar button { width: 54px; }
  /* long-press menu */
  .menu { position: absolute; z-index: 12; left: 50%; top: 50%; width: 220px; margin-left: -110px; padding: 6px; border-radius: 20px; transform: translateY(-50%) scale(.92); opacity: 0; pointer-events: none; transition: opacity .18s, transform .25s cubic-bezier(.3,1.3,.45,1);
    background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16)); -webkit-backdrop-filter: blur(16px) saturate(200%) brightness(1.08); backdrop-filter: blur(16px) saturate(200%) brightness(1.08); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.28), 0 1px 2px rgba(20,20,30,.06), 0 12px 32px -14px rgba(20,20,30,.32); }
  .menu.on { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  .menu button { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 44px; padding: 0 14px; border-radius: 14px; font: 400 15px/1 -apple-system, system-ui, sans-serif; color: #1A1917; }
  .menu button:active { background: rgba(24,23,26,.06); } .menu button + button { box-shadow: 0 -.5px 0 rgba(24,23,26,.08); }
  .menu svg { width: 18px; height: 18px; color: rgba(24,23,26,.6); }
  .dim { position: absolute; z-index: 11; inset: 0; background: rgba(244,242,237,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .18s; } .dim.on { opacity: 1; pointer-events: auto; }
  .slot.held { transform: scale(.97) !important; }
  /* crossing into an earlier day: one tiny date, then it's gone */
  .day { position: absolute; z-index: 9; left: 50%; top: calc(60px + var(--safe-top)); transform: translate(-50%, -6px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s; font: 500 10px/1 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #8a867f; }
  .day.on { opacity: 1; transform: translate(-50%, 0); }
  .toast { position: absolute; z-index: 13; left: 50%; bottom: calc(86px + var(--safe-bottom)); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s cubic-bezier(.3,1.3,.45,1);
    padding: 8px 14px; border-radius: 999px; font: 500 13px/1 -apple-system, system-ui, sans-serif; color: #1A1917; background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16)); -webkit-backdrop-filter: blur(16px) saturate(200%) brightness(1.08); backdrop-filter: blur(16px) saturate(200%) brightness(1.08); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.7), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35), inset 0 0 14px rgba(255,255,255,.28), 0 1px 2px rgba(20,20,30,.06), 0 12px 32px -14px rgba(20,20,30,.32); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .empty .say2 { margin-top: 18px; display: grid; justify-items: center; gap: 10px; font: 400 14px/1.4 -apple-system, system-ui, sans-serif; color: #6D6A64; text-align: center; }
  .empty .say2 button { height: 40px; padding: 0 18px; border-radius: 999px; background: #1A1917; color: #fff; font: 500 14px/1 -apple-system, system-ui, sans-serif; }
  .empty .stack { display: grid; place-items: center; }
  .bar svg { width: 20px; height: 20px; }
  .bar .cam { width: 48px; } .bar .cam i { width: 26px; height: 26px; border-radius: 50%; border: 1.6px solid currentColor; position: relative; } .bar .cam i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: currentColor; opacity: .9; }
  .bar .dot::after { content: ""; position: absolute; right: 9px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: #C8553A; }
  /* after the last one: an empty frame, waiting for yours */
  .empty { position: absolute; inset: 0 0 64px; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .empty.on { opacity: 1; pointer-events: auto; }
  .empty .frame { width: 58%; aspect-ratio: 1024 / 1448; border-radius: 3px; border: 1.5px dashed rgba(24,23,26,.16); display: grid; place-items: center; }
  .empty .frame i { width: 46px; height: 46px; border-radius: 50%; border: 1.6px solid rgba(24,23,26,.3); position: relative; } .empty .frame i::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: rgba(24,23,26,.18); }
  .cap { margin-top: 16px; font: 500 10px/1 var(--mono); letter-spacing: .12em; color: #9a968f; text-transform: uppercase; text-align: center; }
  /* who sent it: top left, very small (Cody, 18 Nov). Four versions: A picture + name, B stamp + name, C stamp only, D on the card itself */
  .who { position: absolute; z-index: 8; left: 20px; top: calc(54px + var(--safe-top)); display: flex; align-items: center; gap: 9px; transition: opacity .18s; }
  .who.fade { opacity: 0; }
  /* when it was posted (Cody, 19 Nov): centred in the space above the card */
  .who { left: 0; right: 0; flex-direction: column; gap: 5px; text-align: center; pointer-events: none;
    top: calc((var(--cardTop, 150px) + var(--safe-top)) / 2 - 17px); }
  .who .d { font: 600 15px/1 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; color: var(--ink); }
  .who .t { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; color: #8a867f; }
  /* the drawn faces lie over the stand-in; the signature stamp and its clip stay on top */
  .face .tex { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; object-fit: cover; }
  .front .st, .front .clip { z-index: 2; }
  .front .nm0 { position: absolute; left: 5.5%; bottom: 4.4%; font: 500 7px/1 var(--mono); letter-spacing: .16em; color: #8a867f; text-transform: uppercase; }
  .drawn .front .st { top: 2.4%; }
  /* turning over: the card lifts off the table mid-turn */
  .card.turn .face { animation: lift .6s cubic-bezier(.3,1,.45,1); }
  @keyframes lift { 45% { box-shadow: 0 2px 4px rgba(20,20,30,.1), 0 60px 80px -34px rgba(20,20,30,.55); } }
  .who .pic { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1.5px var(--card), 0 1px 4px rgba(0,0,0,.18); } .who .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who .stp { width: 22px; height: 27px; background: #FBFAF6; padding: 2px; filter: drop-shadow(0 1px 1.2px rgba(0,0,0,.22));
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 34%) -2.5px -2.5px / 5px 5px, linear-gradient(#000, #000) 2.5px 2.5px / calc(100% - 5px) calc(100% - 5px) no-repeat; mask: radial-gradient(circle at 50% 50%, transparent 32%, #000 34%) -2.5px -2.5px / 5px 5px, linear-gradient(#000, #000) 2.5px 2.5px / calc(100% - 5px) calc(100% - 5px) no-repeat; }
  .who .stp img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who .nm { font: 500 13.5px/1.15 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; color: var(--ink); } .who .nm small { display: block; font-size: 11px; color: #A8A49E; font-weight: 400; }
  .who .tip { position: absolute; left: 30px; top: 50%; transform: translate(0, -50%) scale(.9); opacity: 0; transition: opacity .2s, transform .25s; white-space: nowrap; padding: 5px 9px; border-radius: 999px; font: 500 12px/1 -apple-system, system-ui, sans-serif; background: rgba(255,255,255,.7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.08); }
  .who.show .tip { opacity: 1; transform: translate(0, -50%); }
  .front .by { position: absolute; left: 5.5%; bottom: 4.2%; font: 500 12px/1 -apple-system, system-ui, sans-serif; color: #5f5c57; display: flex; align-items: center; gap: 6px; } .front .by small { color: #b0aca5; font-size: 11px; font-weight: 400; }
  .front .by i { width: 16px; height: 16px; border-radius: 50%; overflow: hidden; display: block; } .front .by i img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vpick { position: absolute; z-index: 20; right: 14px; top: calc(52px + var(--safe-top)); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .vpick button { width: 26px; height: 24px; border-radius: 999px; font: 600 11px/1 -apple-system, system-ui, sans-serif; color: rgba(24,23,26,.45); } .vpick button.on { background: var(--ink); color: #fff; }
  .note2 { max-width: 390px; margin: 8px auto 0; font: 400 12px/17px -apple-system, system-ui, sans-serif; color: #8a867f; text-align: center; }
  @media (max-width: 500px) { .note2 { display: none; } }
  @media (max-width: 500px) { body { background: var(--room); } .phone { width: 100vw; height: 100svh; aspect-ratio: auto; border-radius: 0; box-shadow: none; } .sb, .cap { display: none; } }
  /* prototype only: a way back to the list of pages (not part of the app) */
  .proto-back { position: absolute; z-index: 20; right: 16px; top: calc(56px + var(--safe-top)); height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center;
    font: 500 12px/1 -apple-system, system-ui, sans-serif; color: rgba(24,23,26,.6); text-decoration: none; background: rgba(255,255,255,.45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.8); }
</style>

<body>
<div>
  <div class="phone" id="phone">
    <div class="sb"><span>9:41</span><i></i><span>●●●</span></div>
    <a class="proto-back" href="index.html" aria-label="Back to all prototypes">‹ All</a>
    <div class="who" id="who"></div>
    <div class="deck" id="deck"></div>
    <div class="empty" id="empty"><div class="stack"><div class="frame"><i></i></div><div class="say2" id="say2"></div></div></div>
    <div class="day" id="day"></div><div class="toast" id="toast" role="status"></div>
    <div class="dim" id="dim"></div>
    <div class="menu" id="menu" role="menu"><button type="button" role="menuitem">Reply with a postcard <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8L5 12l5 4"/><path d="M5 12h9a5 5 0 015 5v1"/></svg></button><button type="button" role="menuitem">Keep on my desk <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg></button><button type="button" role="menuitem">Leave a sticker <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a4 4 0 00-4 4v10a4 4 0 004 4h10a4 4 0 004-4v-7"/><path d="M14 3v4a3 3 0 003 3h4z"/></svg></button></div>
    <nav class="bar" aria-label="Poto">
      <button type="button" class="on" aria-label="Postcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8 7h8v7H8z"/></svg><span class="lab">Postcards</span></button>
      <button type="button" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span class="lab">Calendar</span></button>

      <button type="button" class="dot" aria-label="Rolls (a roll was passed to you)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="7" y="5" width="10" height="15" rx="2"/><path d="M9 3h6v2H9zM9 20h6v1.5H9z"/></svg><span class="lab">Rolls</span></button>
      <button type="button" aria-label="Your desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.3-3.6 4-5.2 7-5.2s5.7 1.6 7 5.2"/></svg><span class="lab">Desk</span></button>
    </nav>
  </div>
  <p class="cap">tap to turn over · swipe up for the next · hold for more</p>

<script>
const NEW = /[?&]new/.test(location.search);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];   // ?new shows a brand-new user's Home
const ph = (n, s) => 'img/photo-' + String(n).padStart(2, '0') + (s || '') + '.jpg';
const F = [   // Cody's sample friends (19 Nov); c = the country edition of the back
  { photo: 3, stamp: 7, msg: 'the market at 9pm. everything lit up at once.', name: 'alva', at: '2026-11-17T21:04', city: 'New York', c: 'us' },
  { photo: 6, stamp: 1, msg: 'lunch, finally. we queued an hour. worth it.', name: 'pupu', at: '2026-11-17T13:22', city: 'Shanghai', c: 'cn' },
  { photo: 9, stamp: 4, msg: 'look at this sky. i stopped walking for it.', name: 'bubu', at: '2026-11-17T17:48', city: 'Copenhagen', c: 'dk' },
  { photo: 2, stamp: 8, msg: 'made it to the top. legs gone, view not.', name: 'vava', at: '2026-11-17T11:05', city: 'Paris', c: 'fr' },
  { photo: 5, stamp: 11, msg: 'sunday reset. coffee, laundry, nowhere to be.', name: 'alal', at: '2026-11-17T09:31', city: 'Berlin', c: 'de' },
  { photo: 12, stamp: 7, msg: 'found the good noodle place again.', name: 'alva', at: '2026-11-16T20:12', city: 'New York', c: 'us' },
  { photo: 10, stamp: 4, msg: 'rain all day. stayed in. no regrets.', name: 'bubu', at: '2026-11-16T15:40', city: 'Copenhagen', c: 'dk' },
  { photo: 8, stamp: 1, msg: 'first frost on the window.', name: 'pupu', at: '2026-11-15T08:17', city: 'Shanghai', c: 'cn' },
];
F.forEach((f) => { const d = new Date(f.at); f.where = f.city + ' · ' + d.getDate() + ' ' + MON[d.getMonth()]; f.day = d.toDateString(); });
if (NEW) F.length = 0;
const CLIP = '<svg class="clip" viewBox="0 0 20 46" fill="none" stroke="#9a9aa2" stroke-width="2.6" stroke-linecap="round"><path d="M6 12v22a4 4 0 008 0V9a6 6 0 00-12 0v27a8 8 0 0016 0V14"/></svg>';
const st = (n) => '<span class="st"><img src="' + ph(n, '-t') + '" alt=""></span>';
// ---- the card itself (Cody, 19 Nov): the full textured postcard, drawn by the same paper as the 3D card.
//      Front: the photo printed on the stock, the sender's name bottom left, poto bottom right in typewriter.
//      Back: the country edition (Cody's designs) with the typed message, the note, their signature stamp and postmark,
//      the colour strip and the wax seal. Until a card's faces are drawn, a plain version stands in. ----
const BACKS = {
  us: { strip: ['#B22234', '#F4F1EA', '#3C3B6E'] }, cn: { strip: ['#DE2910', '#FFDE00', '#DE2910'] }, dk: { strip: ['#C8102E', '#F4F1EA', '#C8102E'] },
  fr: { strip: ['#0055A4', '#F4F1EA', '#EF4135'] }, de: { strip: ['#1B1B1B', '#DD0000', '#FFCE00'] },
};
const loadImg = (src) => new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
const toURL = (c) => new Promise((r) => c.toBlob((b) => r(URL.createObjectURL(b)), 'image/jpeg', 0.92));
const wrap = (t, w) => { const out = []; let line = ''; for (const word of t.split(/\s+/)) { if ((line + ' ' + word).trim().length > w) { out.push(line); line = word; } else line = (line + ' ' + word).trim(); } if (line) out.push(line); return out; };
const fontsIn = Promise.race([Promise.all(['37px "Special Elite"', '24px "Special Elite"', '56px "La Belle Aurore"', '500 19px "IBM Plex Mono"'].map((f) => document.fonts.load(f))).catch(() => {}), new Promise((r) => setTimeout(r, 2500))]);
const drawn = new Map();
const idle = (fn) => new Promise((r) => setTimeout(() => r(fn()), 0));   // let the page paint between the two faces
function faces(k) {                           // { front, back }: each a promise of an image URL (the front comes first: it's what you see)
  if (!window.PotoPaper || !F[k]) return { front: Promise.resolve(null), back: Promise.resolve(null) };
  if (!drawn.has(k)) {
    const f = F[k], B = BACKS[f.c] || BACKS.us, d = new Date(f.at);
    const imgs = fontsIn.then(() => Promise.all([loadImg(ph(f.photo)), loadImg(ph(f.stamp, '-s')), loadImg('img/backs/' + f.c + '.jpg'), loadImg('img/backs/seal-' + f.c + '.png')]));
    const front = imgs.then(([photo]) => photo && idle(() => toURL(PotoPaper.front(photo, f.name, 'matte').col)));
    const back = front.then(() => imgs).then(([photo, stamp, design, seal]) => photo && idle(() => toURL(PotoPaper.back(photo, { message: wrap(f.msg, 25).slice(0, 6), note: ['for cody,', f.name], noteLabel: 'NOTE',
      caption: 'Shot on ' + DAYN[d.getDay()] + ' · ' + f.city, city: f.city, look: 'Sunday', date: [d.getDate() + ' ' + MON[d.getMonth()].toUpperCase(), String(d.getFullYear())],
      stamp: !!stamp, stampPhoto: stamp || photo, design, seal, strip: B.strip }).col)));
    drawn.set(k, { front, back });
  }
  return drawn.get(k);
}
function dress(slot, k) {                     // swap the stand-in for the drawn faces as each is ready
  const fc = faces(k);
  fc.front.then((u) => { if (!u || !slot.isConnected) return; slot.querySelector('.front').insertAdjacentHTML('afterbegin', '<img class="tex" src="' + u + '" alt="" draggable="false">'); slot.classList.add('drawn'); });
  fc.back.then((u) => { if (!u || !slot.isConnected) return; slot.querySelector('.back').insertAdjacentHTML('afterbegin', '<img class="tex" src="' + u + '" alt="" draggable="false">'); });
}
const card = (f) => '<div class="card"><div class="face front"><img src="' + ph(f.photo) + '" alt="" draggable="false">' + st(f.stamp) + CLIP + '<u>poto</u><span class="nm0">' + f.name + '</span></div>' +
  '<div class="face back"><i class="pm"></i><div class="msg">' + f.msg + '<span class="sig">— ' + f.name + '</span></div><u>' + f.where + '</u><u>poto</u></div></div>';
// when it was posted, in the space above the card (Cody, 19 Nov)
const whoEl = document.getElementById('who');
function paintWho(f) {
  if (!f) { whoEl.innerHTML = ''; return; }
  const d = new Date(f.at), h = d.getHours(), t = (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
  whoEl.innerHTML = '<span class="d">' + DAYN[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + '</span><span class="t">' + t + '</span>';
  const s = deck.querySelector('.slot:not(.under):not(.prev)'); if (s) phone.style.setProperty('--cardTop', s.getBoundingClientRect().top - phone.getBoundingClientRect().top + 'px');
}
const phone = document.getElementById('phone');
const deck = document.getElementById('deck'), empty = document.getElementById('empty');
let i = 0, busy = false, moved = false;
function showEmpty() {
  empty.classList.add('on'); paintWho(null);
  document.getElementById('say2').innerHTML = NEW ? '<span>Your friends\' postcards will land here.<br>Poto is better with a few of them.</span><button type="button">Invite a friend</button>' : '';
}
function render() {
  if (!F.length) { showEmpty(); return; }
  deck.innerHTML = '';
  for (let k = Math.min(F.length - 1, i + 1); k >= i; k--) { const s = document.createElement('div'); s.className = 'slot' + (k > i ? ' under' : ''); s.innerHTML = card(F[k]); deck.appendChild(s); dress(s, k); }
  [i + 2, i - 1].forEach((k) => faces(k));      // draw the neighbours ahead of time
  const c = deck.querySelector('.slot:not(.under) .card'); c.onclick = () => { if (!moved && !held) { c.classList.toggle('over'); c.classList.remove('turn'); void c.offsetWidth; c.classList.add('turn'); try { navigator.vibrate && navigator.vibrate(5); } catch (e) {} } held = false; };
  whoEl.classList.remove('fade'); paintWho(F[i]);
  wireHold(deck.querySelector('.slot:not(.under)'));
}
// hold the postcard: a small glass menu (reply, keep, sticker); nothing visible until you ask
const menu = document.getElementById('menu'), dim = document.getElementById('dim');
let holdT = 0, held = false;
function wireHold(slot) {
  if (!slot) return;
  slot.addEventListener('pointerdown', () => { held = false; clearTimeout(holdT); holdT = setTimeout(() => { if (moved) return; held = true; slot.classList.add('held'); menu.classList.add('on'); dim.classList.add('on'); try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} }, 450); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => slot.addEventListener(t, () => clearTimeout(holdT)));
}
const closeMenu = () => { menu.classList.remove('on'); dim.classList.remove('on'); deck.querySelectorAll('.held').forEach((x) => x.classList.remove('held')); };
dim.onclick = closeMenu;
// what the three do (Cody, 19 Nov: everything works)
const toastEl = document.getElementById('toast');
const toast = (t) => { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastEl.t); toastEl.t = setTimeout(() => toastEl.classList.remove('on'), 1600); };
const ACTS = [
  (f) => {                                    // reply: a postcard of your own, from the print you kept last; nothing kept yet, so the camera
    let k = []; try { k = JSON.parse(localStorage.getItem('poto.kept') || '[]'); } catch (e) {}
    if (k.length) potoGo('postcard.html?' + new URLSearchParams({ src: k[0].src, zoom: k[0].zoom || 1, ev: k[0].ev || 0, to: f.name }));
    else potoGo('camera.html');
  },
  (f) => {                                    // keep on my desk: it's waiting there next time you open the desk
    let q = []; try { q = JSON.parse(localStorage.getItem('poto.deskAdd') || '[]'); } catch (e) {}
    q.push({ type: 'card', src: f.photo, from: f.name, where: f.where }); try { localStorage.setItem('poto.deskAdd', JSON.stringify(q)); } catch (e) {}
    toast('On your desk');
  },
  (f) => potoGo('postcard.html?' + new URLSearchParams({ src: ph(f.photo), from: f.name, msg: f.msg, where: f.where, sticker: 1 })),   // their card, turned over, stickers out
];
menu.querySelectorAll('button').forEach((b, k) => b.onclick = () => { const f = F[i]; closeMenu(); if (f) ACTS[k](f); });
// ---- swiping (Cody, 18 Nov): the card follows your finger. Drag up and it tilts back over its top edge as it rises;
//      let go past a third of the way (or flick) and it flips away over the top while the next card steps forward.
//      Drag down and the previous card swings back down from above. Let go early and everything springs back. ----
const cur = () => deck.querySelector('.slot:not(.under):not(.prev)'), nxt = () => deck.querySelector('.slot.under');
const easeOut = (t) => 1 - Math.pow(1 - t, 3), easeBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
let drag = null;
function pose(dir, p) {                       // p: 0 = resting, 1 = the swap is complete
  const s = cur(), u = nxt();
  if (dir > 0) {
    if (s) { s.style.transform = 'translateY(' + (-p * 18) + '%) rotateX(' + (p * 80) + 'deg)'; s.style.opacity = p < 0.55 ? 1 : Math.max(0, 1 - (p - 0.55) / 0.45); }
    if (u) { u.style.transform = 'translateY(' + (8 * (1 - p)) + 'px) scale(' + (0.96 + 0.04 * p) + ')'; u.style.opacity = 0.85 + 0.15 * p; }
  } else if (dir < 0) {
    const pv = deck.querySelector('.slot.prev');
    if (pv) { pv.style.transform = 'translateY(' + (-(1 - p) * 18) + '%) rotateX(' + ((1 - p) * 80) + 'deg)'; pv.style.opacity = p > 0.45 ? 1 : p / 0.45; }
    if (s) { s.style.transform = 'translateY(' + (8 * p) + 'px) scale(' + (1 - 0.04 * p) + ')'; s.style.opacity = 1 - 0.15 * p; }
  } else if (s) { s.style.transform = 'translateY(' + p + 'px)'; }   // nothing that way: the card only gives a little
  whoEl.style.opacity = dir ? Math.max(0, 1 - p * 2.2) : '';
}
function settle(dir, from, to, done) {         // animate p from -> to, then finish
  busy = true; const t0 = performance.now(), back = to < from, ms = back ? 300 : 90 + 230 * Math.abs(to - from);
  (function step(now) {
    const t = Math.min(1, (now - t0) / ms), e = back ? easeBack(t) : easeOut(t);
    pose(dir, from + (to - from) * e);
    if (t < 1) return requestAnimationFrame(step);
    busy = false; done && done();
  })(t0);
}
function prepare(dir) {                        // lift the slots out of their CSS transitions; add the previous card above when going back
  deck.querySelectorAll('.slot').forEach((s) => { s.style.transition = 'none'; s.style.transformOrigin = '50% 0'; });
  if (dir < 0 && i > 0 && !deck.querySelector('.slot.prev')) {
    const s = document.createElement('div'); s.className = 'slot prev'; s.style.transition = 'none'; s.style.transformOrigin = '50% 0'; s.innerHTML = card(F[i - 1]); deck.appendChild(s); dress(s, i - 1); pose(-1, 0);
  }
}
function commit(dir) {
  try { navigator.vibrate && navigator.vibrate(6); } catch (e) {}
  if (dir > 0 && i + 1 >= F.length) { deck.innerHTML = ''; i = F.length; showEmpty(); whoEl.style.opacity = ''; return; }
  i += dir; render(); whoEl.style.opacity = '';
}
function go(d) {                               // keyboard, wheel: the same motion, without a finger
  if (busy || drag) return;
  if (empty.classList.contains('on')) { if (d < 0 && F.length) { empty.classList.remove('on'); i = F.length - 1; render(); } return; }
  if (d < 0 && i === 0) return;
  prepare(d); settle(d, 0, 1, () => commit(d));
}
const ph0 = document.getElementById('phone');
ph0.addEventListener('pointerdown', (e) => {
  if (busy || e.target.closest('.bar, .who, .menu, .dim, .empty, .proto-back')) return;
  drag = { y0: e.clientY, x0: e.clientX, dir: 0, p: 0, ys: [[e.timeStamp, e.clientY]] }; moved = false;
});
ph0.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dy = e.clientY - drag.y0, dx = e.clientX - drag.x0;
  drag.ys.push([e.timeStamp, e.clientY]); if (drag.ys.length > 6) drag.ys.shift();
  if (!drag.dir) {
    if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(dx)) return;
    moved = true; clearTimeout(holdT);
    drag.dir = dy < 0 ? 1 : (i > 0 ? -1 : 0); if (dy > 0 && i === 0) drag.dir = 2;   // 2: nothing above, just give a little
    if (empty.classList.contains('on')) { drag = null; if (dy > 0) go(-1); return; }
    prepare(drag.dir === 2 ? 0 : drag.dir); drag.y0 = e.clientY;
  }
  const d = e.clientY - drag.y0, span = deck.clientHeight * 0.55;
  if (drag.dir === 2) { pose(0, Math.max(0, d) * 0.12); return; }
  drag.p = Math.max(0, Math.min(1, (drag.dir > 0 ? -d : d) / span));
  pose(drag.dir, drag.p);
});
function release(e) {
  if (!drag) return; const g = drag; drag = null;
  setTimeout(() => (moved = false), 0);
  if (!g.dir) return;
  if (g.dir === 2) { const s = cur(); if (s) { s.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)'; s.style.transform = ''; } return; }
  const [t0, y0] = g.ys[0], [t1, y1] = g.ys[g.ys.length - 1], v = (y1 - y0) / Math.max(1, t1 - t0);   // px per ms; up is negative
  const flick = g.dir > 0 ? v < -0.45 : v > 0.45;
  if (g.p > 0.33 || (flick && g.p > 0.04)) settle(g.dir, g.p, 1, () => commit(g.dir));
  else settle(g.dir, g.p, 0, () => { const pv = deck.querySelector('.slot.prev'); if (pv) pv.remove(); deck.querySelectorAll('.slot').forEach((s) => { s.style.transition = ''; s.style.transform = ''; s.style.opacity = ''; }); whoEl.style.opacity = ''; });
}
ph0.addEventListener('pointerup', release); ph0.addEventListener('pointercancel', release);
ph0.addEventListener('wheel', (e) => { if (Math.abs(e.deltaY) > 30) { e.preventDefault(); go(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(1); if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go(-1); if (e.key === ' ') { e.preventDefault(); const c = deck.querySelector('.slot:not(.under) .card'); if (c) c.classList.toggle('over'); } });
document.querySelectorAll('.bar button').forEach((b) => b.addEventListener('pointerdown', () => { b.classList.add('say'); clearTimeout(b.t); b.t = setTimeout(() => b.classList.remove('say'), 900); }));
if (NEW) ph0.classList.add('newbie');
render();
</script>
